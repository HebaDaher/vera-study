<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>VERA — Interactive Prototype (Demo)</title>
<!--
  VERA interactive demo — graduation-project prototype.
  Single file: inline CSS + vanilla JS, no libraries, no images, system fonts.
  All data is mocked and generated deterministically; all logic runs in memory.
  Sections:  1 Design system (CSS)  2 Base  3 Components  4 Layout  5 Responsive
             JS: 0 i18n · 1 State · 2 Utilities · 3 Engine · 4 Domain (rules, gate, record)
                 5 Shell rendering · 6 Researcher steps · 7 Verifier · 8 Admin
                 9 Panels (log, help, assistant, rationale, tour) · 10 Events/boot
-->
<style>
/* =====================================================================
   1. DESIGN SYSTEM  (style guide: tokens -> components -> layout)
   One source of truth. Every screen uses these tokens only.
   Brand: deep navy, soft blue, warm orange accent, pale blue, white.
   ===================================================================== */
:root {
  /* --- 1.1 Colour tokens (light) --- */
  --navy: #14234b;          /* brand primary, header */
  --navy-2: #1e3366;
  --blue: #2f5dae;          /* interactive (AA on white: 6.2:1) */
  --blue-soft: #5b8be0;
  --pale: #eaf1fb;          /* pale blue surfaces */
  --orange: #f2913d;        /* brand accent: active step, logo dot (never text) */
  --orange-ink: #8f4308;    /* orange used as text: AA 6.4:1 */
  --cream: #f6ebd6;
  --bg: #f6f8fc;
  --surface: #ffffff;
  --surface-2: #f1f4fa;
  --text: #16203a;          /* 15.6:1 on white */
  --text-2: #475273;        /* 7.6:1 on white */
  --border: #d4dbea;
  --border-strong: #9aa6c2;
  --focus: #1a56db;
  /* semantic (each always paired with an icon + text label) */
  --ok-ink: #17663f;  --ok-bg: #e5f4ec;  --ok-line: #3a9a6a;
  --warn-ink: #7a4f00; --warn-bg: #fff4d6; --warn-line: #d9a106;
  --err-ink: #a5221a;  --err-bg: #fdecea; --err-line: #d9534a;
  --info-ink: #1f56a0; --info-bg: #e8f1fc; --info-line: #5b8be0;
  /* AI / language-model output: purple + dashed outline (never used elsewhere) */
  --ai-ink: #5f3596; --ai-bg: #f5effc; --ai-line: #8e63c7;
  /* decision sources */
  --src-rule: #1f56a0; --src-rule-bg: #e8f1fc;
  --src-res: #17663f;  --src-res-bg: #e5f4ec;

  /* --- 1.2 Type scale (1.25 ratio) --- */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: .75rem; --fs-sm: .875rem; --fs-md: 1rem; --fs-lg: 1.25rem; --fs-xl: 1.5rem; --fs-2xl: 2rem;
  --lh: 1.5;

  /* --- 1.3 Spacing scale (4px base) --- */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --pad-card: var(--s5);
  --radius: 10px; --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(20,35,75,.06), 0 4px 14px rgba(20,35,75,.06);
  --touch: 44px;            /* minimum touch target (WCAG 2.5.5) */
  --header-h: 60px;
}
/* Expert mode = compact density (Step 1: experts want compact detail) */
body.expert { --pad-card: var(--s4); --s5: 18px; }

/* --- 1.4 Dark theme via prefers-color-scheme --- */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1428; --surface: #151f3b; --surface-2: #1b2748; --pale: #1c2a50;
    --text: #e9eefb; --text-2: #b4bfdc; --border: #2c3a63; --border-strong: #52628f;
    --blue: #8fb3ff; --blue-soft: #8fb3ff; --focus: #9dbcff; --orange-ink: #ffb67a;
    --ok-ink: #8fe0b4; --ok-bg: #12301f; --ok-line: #3a9a6a;
    --warn-ink: #ffd772; --warn-bg: #33280a; --warn-line: #d9a106;
    --err-ink: #ffaaa3; --err-bg: #3a1513; --err-line: #d9534a;
    --info-ink: #a9c8ff; --info-bg: #13264a; --info-line: #5b8be0;
    --ai-ink: #d6b9ff; --ai-bg: #2a1d44; --ai-line: #a882e0;
    --src-rule: #a9c8ff; --src-rule-bg: #13264a; --src-res: #8fe0b4; --src-res-bg: #12301f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 100%; }
body { margin: 0; font-family: var(--font); font-size: var(--fs-md); line-height: var(--lh); color: var(--text); background: var(--bg); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 var(--s3); }
h1 { font-size: var(--fs-xl); } h2 { font-size: var(--fs-lg); } h3 { font-size: var(--fs-md); } h4 { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); }
p { margin: 0 0 var(--s3); }
a { color: var(--blue); }
code, .mono { font-family: var(--mono); font-size: .9em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; inset-inline-start: var(--s3); top: -60px; background: var(--surface); color: var(--text); padding: var(--s2) var(--s4); z-index: 100; border-radius: var(--radius-sm); }
.skip-link:focus { top: var(--s2); }
.muted { color: var(--text-2); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.row { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
.stack > * + * { margin-top: var(--s4); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--s4); }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s4); }
.spacer { flex: 1; }
hr { border: 0; border-top: 1px solid var(--border); margin: var(--s4) 0; }

/* =====================================================================
   3. COMPONENTS
   ===================================================================== */
/* --- 3.1 Buttons (same function = same look: Gestalt similarity) --- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--touch); padding: 0 var(--s4);
  border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  font: inherit; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-2); }
@media (prefers-color-scheme: dark) { .btn-primary { background: #8fb3ff; border-color: #8fb3ff; color: #0d1428; } .btn-primary:hover { background: #a9c5ff; } }
.btn-danger { border-color: var(--err-line); color: var(--err-ink); }
.btn-danger:hover { background: var(--err-bg); }
.btn-ai { border: 1px dashed var(--ai-line); color: var(--ai-ink); background: var(--ai-bg); }
.btn-link { border: 0; background: none; color: var(--blue); text-decoration: underline; padding: 0 var(--s2); min-height: var(--touch); font-weight: 600; }
.btn-sm { min-height: 36px; padding: 0 var(--s3); }
@media (pointer: coarse) { .btn-sm { min-height: var(--touch); } }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.btn-icon { width: var(--touch); padding: 0; }
kbd { font-family: var(--mono); font-size: var(--fs-xs); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); color: var(--text-2); }
.kbd-hint { display: none; }
body.expert .kbd-hint { display: inline; }

/* --- 3.2 Segmented control (menu selection, recognition over recall) --- */
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { min-height: 36px; padding: 0 var(--s3); border: 0; background: transparent; color: inherit; font: inherit; font-size: var(--fs-sm); cursor: pointer; }
.seg button[aria-pressed="true"] { background: rgba(255,255,255,.18); font-weight: 700; box-shadow: inset 0 -3px 0 var(--orange); }
@media (pointer: coarse) { .seg button { min-height: var(--touch); } }

/* --- 3.3 Inputs (form fill-in) --- */
label { font-weight: 600; font-size: var(--fs-sm); display: block; margin-bottom: var(--s1); }
.field { margin-bottom: var(--s4); }
.hint { font-size: var(--fs-xs); color: var(--text-2); margin-top: var(--s1); }
input[type=text], input[type=search], input[type=email], select, textarea {
  width: 100%; min-height: var(--touch); padding: var(--s2) var(--s3); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font: inherit; font-size: var(--fs-sm); }
textarea { min-height: 84px; resize: vertical; }
.field-error { color: var(--err-ink); font-size: var(--fs-xs); margin-top: var(--s1); }
.choice { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); min-height: var(--touch); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; background: var(--surface); }
.choice + .choice { margin-top: var(--s2); }
.choice input { margin-top: 4px; width: 18px; height: 18px; flex: none; accent-color: var(--navy); }
.choice:has(input:checked) { border-color: var(--blue); background: var(--pale); }
.choice:has(input:disabled) { opacity: .6; cursor: not-allowed; }
.choice .choice-title { font-weight: 600; }
.check { display: flex; gap: var(--s2); align-items: flex-start; min-height: var(--touch); padding: var(--s2) 0; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--navy); flex: none; }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s2); }
.chip { font-size: var(--fs-xs); min-height: 32px; padding: 0 var(--s3); border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); cursor: pointer; font-family: inherit; }
@media (pointer: coarse) { .chip { min-height: var(--touch); } }

/* --- 3.4 Cards (distinct chunks, Gestalt closure) --- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--pad-card); box-shadow: var(--shadow); }
.card + .card { margin-top: var(--s4); }
.card-head { display: flex; align-items: flex-start; gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
.card-head h2, .card-head h3 { margin: 0; }
.card.is-done { border-inline-start: 4px solid var(--ok-line); }
.card.is-blocked { border-inline-start: 4px solid var(--err-line); }
.card.is-question { border-inline-start: 4px solid var(--warn-line); background: linear-gradient(0deg, var(--surface), var(--surface)); }

/* --- 3.5 Badges / tags (icon + text; colour never carries meaning alone) --- */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 700; padding: 2px var(--s2); border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.badge.ok { color: var(--ok-ink); background: var(--ok-bg); }
.badge.warn { color: var(--warn-ink); background: var(--warn-bg); }
.badge.err { color: var(--err-ink); background: var(--err-bg); }
.badge.info { color: var(--info-ink); background: var(--info-bg); }
.badge.neutral { color: var(--text-2); background: var(--surface-2); }
.badge.rule { color: var(--src-rule); background: var(--src-rule-bg); }
.badge.res { color: var(--src-res); background: var(--src-res-bg); }
.badge.ai { color: var(--ai-ink); background: var(--ai-bg); border-style: dashed; }
.badge.proto { color: var(--navy); background: var(--cream); border-color: var(--orange); }

/* --- 3.6 Alerts / messages: icon + label + colour; what, why, next --- */
.alert { display: grid; grid-template-columns: auto 1fr; gap: var(--s1) var(--s3); padding: var(--s3) var(--s4); border-radius: var(--radius-sm); border: 1px solid; border-inline-start-width: 5px; margin: var(--s3) 0; }
.alert .a-ico { font-size: 1.15rem; line-height: 1.3; font-weight: 700; }
.alert .a-label { font-weight: 800; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .05em; margin-inline-end: var(--s2); }
.alert .a-title { font-weight: 700; }
.alert p { margin: 2px 0 0; font-size: var(--fs-sm); }
.alert .a-next { font-weight: 600; }
.alert.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); }
.alert.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.alert.err { background: var(--err-bg); border-color: var(--err-line); color: var(--err-ink); }
.alert.info { background: var(--info-bg); border-color: var(--info-line); color: var(--info-ink); }
.alert p, .alert .a-title { color: var(--text); }

/* --- 3.7 AI-suggested content (visually distinct from everything else) --- */
.ai-box { border: 2px dashed var(--ai-line); background: var(--ai-bg); border-radius: var(--radius); padding: var(--s4); }
.ai-field { outline: 2px dashed var(--ai-line); outline-offset: 1px; background: var(--ai-bg) !important; }
.ai-tag { color: var(--ai-ink); font-size: var(--fs-xs); font-weight: 700; }
mark.verified { background: var(--src-rule-bg); color: var(--src-rule); padding: 0 3px; border-radius: 3px; font-weight: 700; }

/* --- 3.8 Tables --- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
th, td { padding: var(--s2) var(--s3); text-align: start; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface-2); font-weight: 700; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .03em; color: var(--text-2); }
tr:last-child td { border-bottom: 0; }
tbody th { text-transform: none; letter-spacing: 0; font-size: var(--fs-sm); color: var(--text); background: transparent; }
/* English content inside the Arabic (RTL) layout keeps its own direction */
[dir=rtl] :is(p, li, dd, dt, td, th, h2, h3, label, summary, blockquote, figcaption, .le-text, .le-reason, .a-title, .choice-title, .stat-big) { unicode-bidi: plaintext; }
td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
.cell-missing { color: var(--err-ink); font-style: italic; }

/* --- 3.9 Details / progressive disclosure --- */
details.disclose { border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: var(--s3); background: var(--surface); }
details.disclose > summary { cursor: pointer; padding: var(--s3) var(--s4); min-height: var(--touch); font-weight: 600; color: var(--blue); list-style: none; display: flex; align-items: center; gap: var(--s2); }
details.disclose > summary::before { content: "▸"; transition: transform .15s; }
details.disclose[open] > summary::before { transform: rotate(90deg); }
[dir=rtl] details.disclose > summary::before { content: "◂"; }
[dir=rtl] details.disclose[open] > summary::before { transform: rotate(-90deg); }
details.disclose > .d-body { padding: 0 var(--s4) var(--s4); }
details.disclose > summary::-webkit-details-marker { display: none; }

/* --- 3.10 Progress + skeleton (responsiveness) --- */
.progress { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.progress > span { display: block; height: 100%; background: var(--blue); transition: width .3s; }
.skeleton { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: sk 1.2s infinite; margin: 6px 0; }
@keyframes sk { to { background-position: -200% 0; } }
.proc-list { list-style: none; padding: 0; margin: 0; }
.proc-list li { display: flex; gap: var(--s2); align-items: center; padding: 6px 0; font-size: var(--fs-sm); }
.proc-list .pi { width: 22px; text-align: center; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* --- 3.11 Glossary term (tooltip on hover/focus) --- */
.term { border-bottom: 2px dotted var(--blue); cursor: help; color: inherit; }
#tooltip { position: fixed; z-index: 90; max-width: 300px; background: var(--navy); color: #fff; padding: var(--s3); border-radius: var(--radius-sm); font-size: var(--fs-sm); box-shadow: var(--shadow); pointer-events: none; display: none; }
#tooltip b { display: block; margin-bottom: 2px; color: var(--cream); }
@media (prefers-color-scheme: dark) { #tooltip { background: #e9eefb; color: #0d1428; } #tooltip b { color: #14234b; } }

/* =====================================================================
   4. LAYOUT  (standard elements in fixed positions: consistency)
   ===================================================================== */
.topbar { position: sticky; top: 0; z-index: 40; background: var(--navy); color: #fff; }
.topbar-inner { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); flex-wrap: wrap; min-height: var(--header-h); }
.brand { display: flex; align-items: center; gap: var(--s2); color: #fff; text-decoration: none; font-weight: 800; letter-spacing: .08em; font-size: 1.15rem; background: none; border: 0; cursor: pointer; min-height: var(--touch); font-family: inherit; }
.brand small { font-weight: 500; letter-spacing: 0; opacity: .85; font-size: var(--fs-xs); }
.topbar .group { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.topbar .group-label { font-size: var(--fs-xs); opacity: .8; }
.topbar .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); min-height: 36px; }
.topbar .btn:hover { background: rgba(255,255,255,.12); }
@media (pointer: coarse) { .topbar .btn { min-height: var(--touch); } }
.topbar :focus-visible { outline-color: #ffd29e; }
.state-chip { font-size: var(--fs-xs); font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); white-space: nowrap; }
.proto-strip { background: var(--cream); color: #3d2a0c; font-size: var(--fs-xs); padding: 4px var(--s4); text-align: center; border-bottom: 1px solid var(--orange); }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; padding: var(--s2) var(--s4); background: var(--navy-2); color: #fff; font-size: var(--fs-sm); }
@media (prefers-color-scheme: dark) { .topbar, .toolbar { background: #0a1022; } .toolbar { border-bottom: 1px solid var(--border); } }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; gap: 0; min-height: calc(100vh - 140px); }
.layout.no-stepper { grid-template-columns: minmax(0, 1fr) 320px; }
.layout.no-log { grid-template-columns: 260px minmax(0, 1fr); }
.layout.no-stepper.no-log { grid-template-columns: minmax(0, 1fr); }
#main { padding: var(--s5); max-width: 980px; width: 100%; margin: 0 auto; }
#main:focus { outline: none; }

/* --- 4.1 Stepper (closure + continuity: one connected line) --- */
.stepper { border-inline-end: 1px solid var(--border); background: var(--surface); padding: var(--s4) var(--s3); position: sticky; top: var(--stick-top, 140px); align-self: start; height: calc(100vh - var(--stick-top, 140px)); overflow: auto; }
.stepper .dash-link { width: 100%; justify-content: flex-start; margin-bottom: var(--s3); }
.step-group { margin-bottom: var(--s4); }
.step-group-title { font-size: var(--fs-xs); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); padding: 0 var(--s2) var(--s1); display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.nollm { font-size: 10px; font-weight: 700; color: var(--src-rule); background: var(--src-rule-bg); border: 1px solid currentColor; padding: 0 6px; border-radius: 999px; text-transform: none; letter-spacing: 0; }
.step-list { list-style: none; margin: 0; padding: 0; position: relative; }
.step-list::before { content: ""; position: absolute; inset-inline-start: 21px; top: 22px; bottom: 22px; width: 2px; background: var(--border); }
.step-btn { position: relative; display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--touch); padding: 4px var(--s2); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text); font: inherit; font-size: var(--fs-sm); text-align: start; cursor: pointer; }
.step-btn:hover { background: var(--surface-2); }
.step-btn[aria-current="step"] { background: var(--pale); font-weight: 700; box-shadow: inset 3px 0 0 var(--orange); }
[dir=rtl] .step-btn[aria-current="step"] { box-shadow: inset -3px 0 0 var(--orange); }
.step-dot { position: relative; z-index: 1; flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 800; border: 2px solid var(--border-strong); background: var(--surface); color: var(--text-2); }
.step-btn[data-status="done"] .step-dot { background: var(--ok-line); border-color: var(--ok-line); color: #fff; }
.step-btn[data-status="blocked"] .step-dot { border-color: var(--err-line); color: var(--err-ink); }
.step-btn[aria-current="step"] .step-dot { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(242,145,61,.3); }
.step-meta { display: block; font-size: var(--fs-xs); color: var(--text-2); font-weight: 400; }

/* --- 4.2 Decision log = lab notebook --- */
.notebook { border-inline-start: 1px solid var(--border); background: var(--surface); position: sticky; top: var(--stick-top, 140px); align-self: start; height: calc(100vh - var(--stick-top, 140px)); display: flex; flex-direction: column; }
.notebook-head { padding: var(--s4); border-bottom: 1px solid var(--border); }
.notebook-head h2 { font-size: var(--fs-md); margin-bottom: var(--s1); display: flex; gap: var(--s2); align-items: center; }

.notebook-foot { padding: var(--s3) var(--s4); border-top: 1px solid var(--border); display: flex; gap: var(--s2); flex-wrap: wrap; }

/* --- 4.3 Drawers (help, assistant, rationale) + dialogs --- */
.drawer { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(440px, 100vw); background: var(--surface); color: var(--text); z-index: 60; box-shadow: -8px 0 30px rgba(0,0,0,.2); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .2s; visibility: hidden; }

.drawer.open { transform: none !important; visibility: visible; }
.drawer-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); }
.drawer-head h2 { margin: 0; font-size: var(--fs-lg); flex: 1; }

.modal-actions { display: flex; gap: var(--s2); justify-content: flex-end; flex-wrap: wrap; margin-top: var(--s4); }

/* chat (assistant) */
.chat { display: flex; flex-direction: column; gap: var(--s3); }
.msg { padding: var(--s3); border-radius: var(--radius); font-size: var(--fs-sm); max-width: 92%; }
.msg.user { align-self: flex-end; background: var(--pale); border: 1px solid var(--border); }
.msg.bot { align-self: flex-start; }
.chat-form { display: flex; gap: var(--s2); padding: var(--s3) var(--s4); border-top: 1px solid var(--border); }

/* toasts */
#toasts { position: fixed; bottom: var(--s4); inset-inline-end: var(--s4); z-index: 80; display: flex; flex-direction: column; gap: var(--s2); width: min(380px, calc(100vw - 32px)); }

.step-nav { display: flex; gap: var(--s2); justify-content: space-between; margin-top: var(--s5); padding-top: var(--s4); border-top: 1px solid var(--border); flex-wrap: wrap; }

/* drop zone (direct manipulation) */
.dropzone { border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: var(--s6) var(--s4); text-align: center; background: var(--surface-2); transition: background .15s, border-color .15s; }

/* statistics visuals */

.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--s4); font-size: var(--fs-sm); }

.minichart { display: block; max-width: 100%; height: auto; }

.segment { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--s3) var(--s4); background: var(--surface); }

/* =====================================================================
   5. RESPONSIVE (desktop-first; tablet; phone)
   ===================================================================== */
@media (max-width: 1180px) {

<script>

const I18N = {

  },

    researcher: 'باحث', verifier: 'مُدقِّق', admin: 'مسؤول النظام', help: 'مساعدة', ask: 'اسأل فيرا',

    assistTitle: 'مساعد فيرا', ratTitle: 'مبررات التصميم (التفاعل بين الإنسان والحاسوب)',
    close: 'إغلاق', tour: 'ابدأ الجولة التعريفية (دقيقة واحدة)', stDraft: 'مسودة', stAwait: 'بانتظار التأكيد', stReady: 'جاهز للتشغيل',

};
function t(key) { return (I18N[S.lang] && I18N[S.lang][key]) || I18N.en[key] || key; }

/* =====================================================================
   1. STATE  (in-memory only: no localStorage / sessionStorage by design)
   ===================================================================== */
const S = {
  role: 'researcher', lang: 'en', mode: 'novice', explain: 'plain', view: 'dashboard', logOpen: true,
  dataset: null,          // { name, rows, csv, hashV0, loadedAt, source }
  profiling: false,
  decl: null,             // study declaration object
  declDraft: null,        // working copy of the form
  checksRun: false, discrepancies: [],
  prep: { missing: null, outliers: null, filter: null },
  selected: null,         // candidate id
  overrides: [],          // { cand, justification, at, active }
  warnings: {},           // { 'W-01': 'pause' | 'ack' }
  independence: null,     // { answer, reason }
  approvals: { method: false, datasetChanges: false, missing: false, exclusions: false, warnings: false, final: false },
  lockAck: false,
  running: false, runs: [], currentRun: null, summaryShown: false,
  qual: null,
  log: [], audit: [], undo: [],
  verifier: { dataset: null, datasetLabel: '', record: null, recordLabel: '', result: null, cmpA: '', cmpB: '' },
  users: null, auditFilter: { type: 'all', q: '' },

};

/* =====================================================================
   2. UTILITIES
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function nowISO() { return new Date().toISOString(); }
function hhmmss(iso) { const d = new Date(iso); return d.toTimeString().slice(0, 8); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function plain() { return S.explain === 'plain'; }
/* pick plain or detailed wording (Plain / Detailed toggle) */
function px(p, d) { return plain() ? p : d; }

/* --- Message design: icon + text label + colour; what happened, why, what next --- */
const MSG = { ok: ['✓', 'Success'], warn: ['⚠', 'Warning'], err: ['✕', 'Error'], info: ['ℹ', 'Info'] };
function alertBox(type, title, why = '', next = '') {
  const [ico, label] = MSG[type];
  return `<div class="alert ${type}" role="${type === 'err' ? 'alert' : 'status'}">
    <span class="a-ico" aria-hidden="true">${ico}</span>
    <div><span class="a-label">${label}</span><span class="a-title">${title}</span>
    ${why ? `<p>${why}</p>` : ''}${next ? `<p class="a-next">→ ${next}</p>` : ''}</div></div>`;
}
function toast(type, text, action) {
  const [ico, label] = MSG[type];
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="t-ico" aria-hidden="true">${ico}</span><div><b>${label}:</b> ${text}</div>`;
  const close = document.createElement('button');
  close.className = 'btn btn-sm'; close.type = 'button'; close.setAttribute('aria-label', 'Dismiss notification'); close.textContent = '✕';
  if (action) {
    const a = document.createElement('button'); a.className = 'btn btn-sm'; a.type = 'button'; a.textContent = action.label;
    a.addEventListener('click', () => { action.fn(); el.remove(); });
    const wrap = document.createElement('div'); wrap.className = 'row'; wrap.append(a, close); el.append(wrap);
  } else el.append(close);
  close.addEventListener('click', () => el.remove());
  $('#toasts').append(el);
  while ($('#toasts').children.length > 3) $('#toasts').firstElementChild.remove();   // max 3 visible: low noise
  setTimeout(() => el.remove(), action ? 9000 : 5500);

/* ---------- 3.1 Seeded PRNG (mulberry32) + normal generator ---------- */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function normalFrom(rand) {            // Box–Muller, deterministic given rand
  const u = Math.max(rand(), 1e-12), v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ---------- 3.2 Sample dataset: 3 teaching methods x stress ---------- */
const SAMPLE_SEED = 20261134;
const GROUPS = ['Lecture', 'Flipped', 'Project-based'];
function buildSampleDataset() {
  const rand = mulberry32(SAMPLE_SEED);
  const mu = { 'Lecture': Math.log(13), 'Flipped': Math.log(9), 'Project-based': Math.log(7) };
  const missingIdx = [7, 33, 58, 81];          // 4 of 90 = 4.4% missing outcome
  const failIdx = [21, 66];                    // two failed attention checks
  const rows = [];
  for (let i = 0; i < 90; i++) {
    const g = GROUPS[Math.floor(i / 30)];
    const z = normalFrom(rand);
    let s = Math.round(3 + Math.exp(mu[g] + 0.62 * z));   // right-skewed (log-normal)
    s = Math.min(40, Math.max(0, s));
    rows.push({
      participant_id: 'P' + String(i + 1).padStart(3, '0'),
      method: g,
      stress_score: missingIdx.includes(i) ? null : s,
      year_of_study: 1 + Math.floor(rand() * 3),
      age: 18 + Math.floor(rand() * 7),
      attention_check: failIdx.includes(i) ? 'fail' : 'pass'
    });
  }
  return rows;
}
function datasetToCSV(rows) {
  const cols = Object.keys(rows[0]);

/* ---------- 4.1 Data Profiler (UC-17) ---------- */
function profileDataset(rows) {
  const cols = Object.keys(rows[0]);
  const prof = { rows: rows.length, columns: cols.length, vars: {} };
  cols.forEach(c => {
    const vals = rows.map(r => r[c]); const nonNull = vals.filter(v => v !== null && v !== '');
    const numeric = nonNull.every(v => typeof v === 'number');
    const distinct = [...new Set(nonNull)];
    prof.vars[c] = {
      type: numeric ? 'number' : 'text', missing: vals.length - nonNull.length, distinct: distinct.length,
      min: numeric ? Math.min(...nonNull) : null, max: numeric ? Math.max(...nonNull) : null,
      sample: distinct.slice(0, 4)
    };
  });
  prof.groups = {}; GROUPS.forEach(g => prof.groups[g] = rows.filter(r => r.method === g).length);
  const ids = rows.map(r => r.participant_id); prof.duplicateIds = ids.length - new Set(ids).size;
  return prof;
}
/* measured "kind" in researcher language */
function measuredKind(v) {
  if (v.type === 'text') return v.distinct <= 12 ? `Categories (${v.distinct})` : 'Text';
  if (v.distinct <= 5) return `${v.distinct} numeric categories`;
  return `Numbers ${v.min}–${v.max}`;
}

/* ---------- 4.2 Declaration Service ---------- */
function emptyDecl() {
  const vars = {}; COLS.forEach(c => vars[c] = { role: '', level: '' });
  return { goal: '', qtype: '', design: '', vars, ai: {}, reviewed: { goal: false, design: false, vars: false }, ownConfirm: false, aiDrafted: false };
}
function aiDraftDeclaration() {   // LLM Adapter function #1 (simulated). Text only, no statistics.
  return {
    goal: 'Examine whether students taught with three different teaching methods (lecture, flipped classroom, project-based) report different levels of perceived stress.',
    qtype: 'compare', design: 'between',
    vars: {
      participant_id: { role: 'id', level: 'nominal' }, method: { role: 'group', level: 'nominal' },
      stress_score: { role: 'outcome', level: 'continuous' }, year_of_study: { role: 'covariate', level: 'continuous' },
      age: { role: 'covariate', level: 'continuous' }, attention_check: { role: 'filter', level: 'nominal' }
    }
  };
}
function validateDecl(d) {
  const errs = [];
  if (!d.goal.trim()) errs.push(['goal', 'Write your research goal in one or two sentences.']);
  if (!d.qtype) errs.push(['qtype', 'Choose what kind of question you are asking.']);
  if (!d.design) errs.push(['design', 'Choose your study design.']);
  const roles = Object.values(d.vars).map(v => v.role);
  if (roles.filter(r => r === 'outcome').length !== 1) errs.push(['vars', 'Mark exactly one variable as the Outcome (the score you want to compare).']);
  if (d.qtype === 'compare' && roles.filter(r => r === 'group').length !== 1) errs.push(['vars', 'Mark exactly one variable as the Grouping factor (the groups you compare).']);
  Object.entries(d.vars).forEach(([c, v]) => { if (v.role && v.role !== 'unused' && !v.level) errs.push(['vars', `Choose a measurement level for “${c}”.`]); });
  if (Object.values(d.vars).some(v => !v.role)) errs.push(['vars', 'Give every variable a role (choose “Not used” if it is not part of the analysis).']);
  return errs;
}

/* ---------- 4.3 Integrity & variable validation gate (UC-04, UC-18) ---------- */
function runIntegrityChecks(decl, prof) {
  const checks = []; const disc = [];
  const outcome = Object.keys(decl.vars).find(c => decl.vars[c].role === 'outcome');
  const group = Object.keys(decl.vars).find(c => decl.vars[c].role === 'group');
  checks.push({ id: 'I-01', label: 'Every declared variable exists in the data', status: 'pass', detail: `${Object.keys(decl.vars).length} of ${prof.columns} columns matched by name.` });
  // I-02 measurement level vs measured values, for every used variable
  let levelIssues = 0;
  Object.entries(decl.vars).forEach(([c, v]) => {
    if (!v.role || v.role === 'unused' || v.role === 'id') return;
    const m = prof.vars[c];
    if (v.level === 'continuous' && (m.type === 'text' || m.distinct <= 5)) {
      levelIssues++;
      disc.push({ id: 'DX-' + c, var: c, title: `“${c}” is declared continuous, but the data has only ${m.distinct} distinct values`,
        plainWhy: `A continuous variable should have many possible values. “${c}” only takes the values ${m.sample.join(', ')}, which look like ordered categories.`,
        detailWhy: `Declared level: continuous (interval/ratio). Measured: ${m.type}, ${m.distinct} distinct values {${m.sample.join(', ')}}. Rule I-02 requires > 5 distinct values for a continuous declaration.`,
        options: [
          { v: 'ordinal', label: `Treat “${c}” as ordinal (ordered categories)`, note: 'Recommended by rule I-02: values are ordered (1 < 2 < 3).', rec: true },
          { v: 'nominal', label: `Treat “${c}” as nominal (unordered categories)`, note: 'Use if the order is not meaningful.' },
          { v: 'keep', label: 'Keep it as continuous', note: 'Allowed, but your justification is required and shown in the record.' },
          { v: 'halt', label: 'Halt the analysis until I check my design', note: 'Nothing changes; you cannot run until this is resolved.' }
        ], resolved: false, choice: null, reason: '' });
    }
    if ((v.level === 'nominal' || v.level === 'ordinal') && m.type === 'number' && m.distinct > 12) {
      levelIssues++;
      disc.push({ id: 'DX-' + c, var: c, title: `“${c}” is declared ${v.level}, but the data has ${m.distinct} different numbers`,
        plainWhy: `Categories usually have a few values; “${c}” has many different numbers, like a score.`,
        detailWhy: `Declared ${v.level}; measured numeric with ${m.distinct} distinct values (${m.min}–${m.max}). Rule I-02 flags > 12 distinct numeric values.`,
        options: [
          { v: 'continuous', label: `Treat “${c}” as continuous`, note: 'Recommended by rule I-02.', rec: true },
          { v: 'keep', label: `Keep it as ${v.level}`, note: 'Justification required.' },
          { v: 'halt', label: 'Halt the analysis until I check my design', note: '' }
        ], resolved: false, choice: null, reason: '' });
    }
  });
  checks.push({ id: 'I-02', label: 'Declared measurement levels match the measured values', status: levelIssues ? 'fail' : 'pass', detail: levelIssues ? `${levelIssues} mismatch(es) found — see below.` : 'All levels consistent.' });
  const k = group ? prof.vars[group].distinct : 0;
  checks.push({ id: 'I-03', label: 'Grouping factor has the expected number of groups', status: group ? 'pass' : 'fail', detail: group ? `“${group}”: ${k} groups (${Object.values(prof.groups).join(' / ')}).` : 'No grouping factor declared.' });
  checks.push({ id: 'I-04', label: 'No duplicate participant IDs', status: prof.duplicateIds ? 'fail' : 'pass', detail: prof.duplicateIds ? `${prof.duplicateIds} duplicates.` : 'All 90 IDs unique.' });
  if (decl.design === 'within' && !prof.duplicateIds) {
    disc.push({ id: 'DX-design', var: 'design', title: 'Declared “repeated measures”, but every participant appears only once',
      plainWhy: 'In a repeated-measures study the same person gives several scores. Here each ID appears once, which looks like separate groups.',
      detailWhy: 'Declared design: within-subjects. Measured: 90 unique IDs, one row each, each ID in exactly one group.',
      options: [{ v: 'between', label: 'Change design to independent groups (between-subjects)', note: 'Recommended: matches the data.', rec: true }, { v: 'halt', label: 'Halt until I check my design', note: '' }],
      resolved: false, choice: null, reason: '' });
  }
  checks.push({ id: 'I-05', label: 'Design matches data structure (one row per participant)', status: decl.design === 'within' ? 'fail' : 'pass', detail: decl.design === 'within' ? 'Mismatch — see below.' : 'One row per participant, as declared.' });
  const miss = outcome ? prof.vars[outcome].missing : 0;
  checks.push({ id: 'I-06', label: 'Missing values in the outcome', status: miss ? 'info' : 'pass', detail: miss ? `${miss} of ${prof.rows} (${(100 * miss / prof.rows).toFixed(1)}%). Not an error — you decide how to handle them in Step 4.` : 'None.' });
  checks.push({ id: 'I-07', label: 'Independence of observations', status: 'info', detail: 'Cannot be verified from the file. VERA will ask you directly in Step 7.' });
  return { checks, disc };
}

/* ---------- 4.4 Data Preparation (new version; v0 never overwritten) ---------- */
function applyPreparation(v0, policies) {
  // order is fixed and recorded: filter -> outliers -> missing values
  let rows = clone(v0); const steps = [];
  if (policies.filter === 'exclude') { const before = rows.length; rows = rows.filter(r => r.attention_check === 'pass'); steps.push(`Filter: excluded ${before - rows.length} failed attention checks`); }
  const out = iqrOutliers(v0);
  if (policies.outliers === 'exclude') { const before = rows.length; rows = rows.filter(r => !out.includes(r.participant_id)); steps.push(`Exclusions: removed ${before - rows.length} flagged outliers (${out.join(', ')})`); }
  if (policies.missing === 'complete') { const before = rows.length; rows = rows.filter(r => r.stress_score !== null); steps.push(`Missing values: complete-case, ${before - rows.length} rows left out`); }
  if (policies.missing === 'median') {
    const med = {}; GROUPS.forEach(g => { med[g] = quantile(rows.filter(r => r.method === g && r.stress_score !== null).map(r => r.stress_score), .5); });
    let n = 0; rows.forEach(r => { if (r.stress_score === null) { r.stress_score = med[r.method]; n++; } }); steps.push(`Missing values: ${n} filled with group median`);
  }
  const sizes = GROUPS.map(g => rows.filter(r => r.method === g).length);
  return { rows, steps, sizes, n: rows.length, hash: sha256(datasetToCSV(rows)) };
}
function prepPolicies() { return { missing: S.prep.missing?.choice, outliers: S.prep.outliers?.choice, filter: S.prep.filter?.choice }; }
function prepComplete() { return !!(S.prep.missing && S.prep.outliers && S.prep.filter); }
function currentV1() { return (S.dataset && prepComplete()) ? applyPreparation(S.dataset.rows, prepPolicies()) : null; }

/* ---------- 4.5 Rule Engine + Assumption Gate (UC-06, 07, 20, 21) ---------- */
const CAND_META = {
  'R-3G-01': { name: 'One-way ANOVA', key: 'anova', tests: 'whether the group means differ', refs: ['field', 'bf', 'sw'] },
  'R-3G-02': { name: 'Welch\'s ANOVA', key: 'welch', tests: 'whether the group means differ, allowing unequal spreads', refs: ['welch', 'sw'] },
  'R-3G-03': { name: 'Kruskal–Wallis H test', key: 'kruskal', tests: 'whether scores tend to be higher in some groups (rank-based)', refs: ['kw', 'dunn', 'field'] }
};
function diagnostics(rows) {
  const g = groupValues(rows);
  const sw = g.map((v, i) => ({ group: GROUPS[i], n: v.length, ...shapiroWilk(v), skew: skewness(v) }));
  const bf = brownForsythe(g);
  const all = g.flat(); const tieShare = 1 - new Set(all).size / all.length;
  return { sw, bf, tieShare, values: g };
}
function evaluateCandidates(rows, indepAnswer) {
  const d = diagnostics(rows);
  const normFail = d.sw.filter(s => s.p < .05);
  const normCheck = { assump: 'Normality in each group', kind: 'data', termKey: 'normality', result: normFail.length ? 'fail' : 'pass',
    evidence: d.sw.map(s => `${s.group}: W = ${s.W.toFixed(3)}, p ${s.p < .001 ? '< .001' : '= ' + fmtP(s.p)}`).join(' · ') };
  const varCheck = { assump: 'Equal variances', kind: 'data', termKey: 'homogeneity', result: d.bf.p < .05 ? 'fail' : 'pass',
    evidence: `Brown–Forsythe F(${d.bf.df1}, ${d.bf.df2}) = ${d.bf.F.toFixed(2)}, p = ${fmtP(d.bf.p)}` };
  const indCheck = { assump: 'Independent observations', kind: 'design', termKey: 'independence',
    result: !indepAnswer ? 'pending' : indepAnswer === 'yes' ? 'pass' : 'fail',
    evidence: !indepAnswer ? 'Declared study-design assumption — answer the question in Step 7.' : indepAnswer === 'yes' ? 'Researcher answered: observations are independent.' : 'Researcher answered: observations are NOT fully independent.' };
  const ordCheck = { assump: 'Outcome is at least ordinal', kind: 'design', termKey: 'level', result: 'pass', evidence: 'Declared continuous (0–40 score): satisfied.' };
  const status = checks => checks.some(c => c.result === 'fail') ? 'blocked' : 'admissible';
  const c1 = [normCheck, varCheck, indCheck], c2 = [normCheck, indCheck], c3 = [indCheck, ordCheck];
  const list = [
    { id: 'R-3G-01', checks: c1, status: status(c1) },
    { id: 'R-3G-02', checks: c2, status: status(c2) },
    { id: 'R-3G-03', checks: c3, status: status(c3) }
  ];
  list.forEach(c => { Object.assign(c, CAND_META[c.id]); c.alternatives = list.filter(o => o.id !== c.id && o.status === 'admissible').map(o => o.id); });
  // Soft warning W-01: distribution shapes differ -> KW interpreted as dominance, not medians
  const skews = d.sw.map(s => s.skew); const spread = Math.max(...skews) - Math.min(...skews);
  const warnings = spread > 1 ? [{ id: 'W-01', applies: 'R-3G-03', allowAck: true,
    title: 'Group distributions have different shapes',
    plain: 'The groups are skewed by different amounts, so Kruskal–Wallis tells you whether one group tends to score higher — not whether the medians differ.',
    detail: `Skewness ranges from ${Math.min(...skews).toFixed(2)} to ${Math.max(...skews).toFixed(2)} (spread ${spread.toFixed(2)} > 1, rule W-01). Under unequal shapes H tests stochastic dominance, not a location shift.` }] : [];
  return { list, diag: d, warnings };
}
function currentGate() { const v1 = currentV1(); return v1 ? evaluateCandidates(v1.rows, S.independence?.answer) : null; }
function activeOverride(id) { return S.overrides.find(o => o.cand === id && o.active); }

/* ---------- 4.6 Execution Engine (only runs a validated specification) ---------- */
function welchAnova(groups) {
  const k = groups.length, n = groups.map(g => g.length), m = groups.map(mean), v = groups.map(g => sd(g) ** 2);
  const w = n.map((ni, i) => ni / v[i]), W = w.reduce((a, b) => a + b, 0), mw = w.reduce((s, wi, i) => s + wi * m[i], 0) / W;
  const A = w.reduce((s, wi, i) => s + wi * (m[i] - mw) ** 2, 0) / (k - 1);
  const L = w.reduce((s, wi, i) => s + (1 - wi / W) ** 2 / (n[i] - 1), 0);
  const B = 1 + 2 * (k - 2) / (k * k - 1) * L, F = A / B, df2 = (k * k - 1) / (3 * L);
  return { F, df1: k - 1, df2, p: fPvalue(F, k - 1, df2) };
}
function execute(method, rows) {
  const g = groupValues(rows);
  const desc = g.map((v, i) => ({ group: GROUPS[i], n: v.length, mean: mean(v), sd: sd(v), median: quantile(v, .5), q1: quantile(v, .25), q3: quantile(v, .75), min: Math.min(...v), max: Math.max(...v) }));
  let test;
  if (method === 'R-3G-03') { const kw = kruskalWallis(g, GROUPS); test = { statistic: 'H', value: kw.H, df: kw.df, p: kw.p, effect: { name: 'epsilon_squared', value: kw.epsSq }, posthoc: kw.pairs.map(p => ({ pair: `${p.a} vs ${p.b}`, z: p.z, p: p.p, p_holm: p.pHolm })), meanRanks: kw.meanRanks }; }
  else if (method === 'R-3G-01') { const a = oneWayF(g); test = { statistic: 'F', value: a.F, df: [a.df1, a.df2], p: a.p, effect: { name: 'eta_squared', value: a.etaSq } }; }
  else { const w = welchAnova(g); test = { statistic: 'F_welch', value: w.F, df: [w.df1, w.df2], p: w.p, effect: null }; }
  return { method, descriptives: desc, test };
}
/* round every number so the record is stable and comparable */
function roundDeep(o, dp = 6) { return JSON.parse(JSON.stringify(o, (k, v) => typeof v === 'number' ? Math.round(v * 10 ** dp) / 10 ** dp : v)); }

/* full deterministic pipeline: raw rows + recorded policies + method -> results */
function runPipeline(v0rows, policies, method) {
  const v1 = applyPreparation(v0rows, policies);
  return { v0hash: sha256(datasetToCSV(v0rows)), v1hash: v1.hash, v1n: v1.n, sizes: v1.sizes, results: roundDeep(execute(method, v1.rows)), steps: v1.steps };
}

/* ---------- 4.7 Requirements checklist (Run stays disabled until all OK) ---------- */
function requirements() {
  const gate = currentGate(); const sel = S.selected; const cand = gate && sel ? gate.list.find(c => c.id === sel) : null;
  const warnPending = gate ? gate.warnings.filter(w => w.applies === sel && S.warnings[w.id] !== 'ack') : [];
  const r = [
    { k: 'dataset', label: 'Dataset uploaded and profiled', ok: !!S.dataset, go: 1 },
    { k: 'decl', label: 'Study declaration confirmed by you', ok: !!S.decl, go: 2 },
    { k: 'disc', label: 'All declaration-vs-data discrepancies resolved', ok: S.checksRun && S.discrepancies.every(d => d.resolved && d.choice !== 'halt'), go: 3 },
    { k: 'missing', label: 'Missing-value policy recorded', ok: !!S.prep.missing, go: 4 },
    { k: 'outliers', label: 'Exclusion (outlier) policy recorded', ok: !!S.prep.outliers, go: 4 },
    { k: 'filter', label: 'Filter policy recorded', ok: !!S.prep.filter, go: 4 },
    { k: 'indep', label: 'Methodological question answered: independence', ok: S.independence?.answer === 'yes', go: 7,
      note: S.independence && S.independence.answer !== 'yes' ? 'Your answer means the available methods are not valid for this design. VERA pauses here — discuss with your supervisor.' : '' },
    { k: 'method', label: 'Analysis selected (admissible, or overridden with justification)', ok: !!cand && (cand.status === 'admissible' || !!activeOverride(cand.id)), go: 5 },
    { k: 'warn', label: 'Every warning handled (no warning left on “Pause”)', ok: !!cand && warnPending.length === 0, go: 5 },
    ...Object.entries(APPROVAL_LABELS).map(([k, l]) => ({ k: 'ap-' + k, label: `Approved: ${l}`, ok: S.approvals[k], go: 8 })),
    { k: 'lock', label: 'You acknowledged that the record will be locked', ok: S.lockAck, go: 8 }
  ];
  return r;
}
const APPROVAL_LABELS = { method: 'selected method', datasetChanges: 'dataset changes', missing: 'missing-value handling', exclusions: 'exclusions & filters', warnings: 'how warnings are handled', final: 'final settings' };

/* ---------- 4.8 Record Service: machine-readable analysis record ---------- */

/* ---------- 4.9 Independent re-execution & verification (UC-32..36) ---------- */
function reexecute(record, rows) {
  const steps = [];
  const v0 = sha256(datasetToCSV(rows));
  const idOk = v0 === record.dataset.v0_sha256;
  steps.push({ label: 'Dataset identity (SHA-256 of v0)', ok: idOk, recorded: record.dataset.v0_sha256.slice(0, 16) + '…', reproduced: v0.slice(0, 16) + '…' });
  if (!idOk) return { outcome: 'failure', steps, reason: 'The dataset is not the one recorded: its fingerprint differs. Re-execution stopped before any statistics were run.' };
  const pol = {}; record.preparation_policies.forEach(p => { pol[p.policy === 'missing_values' ? 'missing' : p.policy] = p.choice; });
  const pipe = runPipeline(rows, pol, record.selected_analysis.rule);
  steps.push({ label: 'Replayed preparation → prepared version (v1) hash', ok: pipe.v1hash === record.dataset.v1_sha256, recorded: record.dataset.v1_sha256.slice(0, 16) + '…', reproduced: pipe.v1hash.slice(0, 16) + '…' });
  const rv = record.results.test, nv = pipe.results.test;
  const same = (a, b) => Math.abs(a - b) < 1e-6;
  steps.push({ label: `Test statistic (${rv.statistic})`, ok: same(rv.value, nv.value), recorded: r3(rv.value), reproduced: r3(nv.value) });
  steps.push({ label: 'p-value', ok: same(rv.p, nv.p), recorded: fmtP(rv.p), reproduced: fmtP(nv.p) });
  if (rv.effect && nv.effect) steps.push({ label: `Effect size (${rv.effect.name})`, ok: same(rv.effect.value, nv.effect.value), recorded: r3(rv.effect.value), reproduced: r3(nv.effect.value) });
  const descOk = record.results.descriptives.every((d, i) => same(d.median, pipe.results.descriptives[i].median) && d.n === pipe.results.descriptives[i].n);
  steps.push({ label: 'Group descriptives (n, median)', ok: descOk, recorded: record.results.descriptives.map(d => d.n).join('/'), reproduced: pipe.results.descriptives.map(d => d.n).join('/') });
  const allOk = steps.every(s => s.ok);
  return { outcome: allOk ? 'agreement' : 'mismatch', steps, reproduced: pipe.results,
    reason: allOk ? 'Every recorded decision and result was reproduced from the raw data and the record alone.' : 'The dataset is correct, but at least one recorded result differs from the re-executed result.' };
}

function stepStatus(n) {
  const req = Object.fromEntries(requirements().map(r => [r.k, r.ok]));
  switch (n) {
    case 1: return S.dataset ? 'done' : 'todo';
    case 2: return S.decl ? 'done' : 'todo';
    case 3: return !S.checksRun ? 'todo' : S.discrepancies.every(d => d.resolved && d.choice !== 'halt') ? 'done' : 'blocked';
    case 4: return prepComplete() ? 'done' : 'todo';
    case 5: { const g = currentGate(); const c = g && S.selected && g.list.find(x => x.id === S.selected);
      if (c && c.status === 'blocked' && !activeOverride(c.id)) return 'blocked';
      return req.method && req.warn ? 'done' : 'todo'; }
    case 6: return S.overrides.some(o => o.active) ? 'done' : 'optional';
    case 7: return !S.independence ? 'todo' : S.independence.answer === 'yes' ? 'done' : 'blocked';
    case 8: return Object.values(S.approvals).every(Boolean) && S.lockAck ? 'done' : 'todo';
    case 9: return S.currentRun ? 'done' : 'todo';
    case 10: return S.qual && S.qual.every(s => s.status !== 'pending') ? 'done' : 'optional';
  }
}
function statusLabel(st, n) {
  if (st === 'optional' && n === 6) return t('notNeeded');

}
function statusBadge(st, n) {

async function startProfiling(name, rows, source) {
  S.profiling = true; S.view = 1; render();
  for (let i = 0; i < PROFILE_STEPS.length; i++) {
    await sleep(S.mode === 'expert' ? 120 : 330);

  }
  await sleep(200);
  const csv = datasetToCSV(rows);
  S.dataset = { name, rows, csv, hashV0: sha256(csv), loadedAt: nowISO(), source, profile: profileDataset(rows) };
  S.profiling = false;
  logDecision({ step: 1, category: 'dataset', text: `Uploaded “${name}” (${rows.length} rows) as v0, SHA-256 ${S.dataset.hashV0.slice(0, 12)}…`, undoable: false });
  logDecision({ step: 1, category: 'profile', text: `Data Profiler: ${rows.length} rows, ${S.dataset.profile.columns} columns, ${S.dataset.profile.vars.stress_score.missing} missing outcome values, 3 groups.`, source: 'RULE' });

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/); const head = lines[0].split(',').map(s => s.trim());
  return { head, rows: lines.slice(1).map(l => { const cells = l.split(','); const o = {}; head.forEach((h, i) => { const v = (cells[i] ?? '').trim(); o[h] = v === '' ? null : (isNaN(+v) ? v : +v); }); return o; }) };
}
function handleFile(file) {
  if (!file) return;
  if (!/\.csv$/i.test(file.name)) { toast('err', `“${esc(file.name)}” is not a CSV file. Save it as .csv and try again, or load the sample dataset.`); return; }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const { head, rows } = parseCSV(String(reader.result));
      const ok = COLS.every(c => head.includes(c));
      if (!ok) { $('#main').insertAdjacentHTML('afterbegin', alertBox('warn', `“${esc(file.name)}” was read (${rows.length} rows, ${head.length} columns), but this prototype cannot analyse it.`, `The prototype's rule set is configured for the demo study only (columns: ${COLS.join(', ')}). Your file has: ${head.map(esc).join(', ')}.`, 'Load the sample dataset to continue the demo.')); return; }
      startProfiling(file.name, rows.map(r => { const o = {}; COLS.forEach(c => o[c] = r[c]); return o; }), 'upload');
    } catch (e) { toast('err', 'The file could not be read as CSV. Check that it uses commas and a header row.'); }
  };
  reader.readAsText(file);
}

/* ---------- Step 4: Data-preparation decisions ---------- */
function prepConfig() {
  const rows = S.dataset.rows; const out = iqrOutliers(rows);
  const missRows = rows.filter(r => r.stress_score === null);
  const fails = rows.filter(r => r.attention_check === 'fail');
  return {
    missing: { title: `${term('missing', 'Missing outcome values')}: ${missRows.length} of ${rows.length} (${(100 * missRows.length / rows.length).toFixed(1)}%)`, approval: 'missing',
      evidence: `Rows: ${missRows.map(r => `${r.participant_id} (${r.method})`).join(', ')}. Spread over all three groups.`,
      rule: 'R-PREP-02', suggestion: 'Complete-case analysis is defensible when less than 5% of the outcome is missing. The rule cannot test <i>why</i> values are missing, so the decision is yours.',
      options: [{ v: 'complete', label: 'Complete-case: leave out the 4 rows without a score', note: `Simple and transparent. Fair if values are missing for unrelated reasons.`, rec: true },
        { v: 'median', label: 'Fill each missing score with its group median', note: '⚠ Shrinks the spread and creates extra tied ranks; usually not recommended.' },
        { v: 'mi', label: 'Multiple imputation', note: 'Not in rule library v0.1 — unavailable in this prototype.', disabled: true }],
      chips: ['Less than 5% missing, spread across groups', 'Missingness appears unrelated to teaching method', 'Pre-registered complete-case analysis'] },
    outliers: { title: `${term('outlier', 'Possible outliers')}: ${out.length} flagged by Tukey's 1.5 × IQR rule`, approval: 'exclusions',
      evidence: out.map(id => { const r = rows.find(x => x.participant_id === id); return `${id} (${r.method}, score ${r.stress_score})`; }).join(', ') + '. Scores are inside the valid 0–40 range.',
      rule: 'R-PREP-04', suggestion: 'Retain valid observations. Values inside the scale range are not errors, and rank-based methods are robust to extreme scores. Excluding them needs a substantive reason.',
      options: [{ v: 'retain', label: 'Keep all flagged scores', note: 'They are plausible scores on the 0–40 scale.', rec: true },
        { v: 'exclude', label: `Exclude the ${out.length} flagged scores`, note: 'Changes the data the analysis sees; must be justified (e.g. a recording error).' }],
      chips: ['Scores are within the valid 0–40 scale range', 'No evidence of recording errors', 'Confirmed data-entry error for these IDs'] },
    filter: { title: `Data-quality filter: ${fails.length} failed attention checks`, approval: 'exclusions',
      evidence: `${fails.map(r => `${r.participant_id} (${r.method})`).join(', ')} answered the attention-check item incorrectly.`,
      rule: 'R-PREP-05', suggestion: 'Apply this filter only if your protocol specified it in advance. The rule cannot know your protocol, so no option is pre-selected.',
      options: [{ v: 'keepall', label: 'Keep all participants', note: 'Use if attention-check exclusion was not planned.' },
        { v: 'exclude', label: `Exclude the ${fails.length} participants who failed`, note: 'Use if your protocol or pre-registration says so.' }],
      chips: ['Exclusion was not pre-registered', 'Protocol pre-specified attention-check exclusion', 'Supervisor advised keeping all participants'] }
  };
}

/* ---------- mini charts (diagnostic evidence) ---------- */
function miniHist(values, label, failed) {
  const bins = new Array(10).fill(0); values.forEach(v => bins[Math.min(9, Math.floor(v / 4))]++);
  const max = Math.max(...bins), W = 170, H = 70;
  const bars = bins.map((b, i) => `<rect x="${i * 16 + 4}" y="${H - 14 - (b / max) * (H - 24)}" width="13" height="${(b / max) * (H - 24)}" style="fill:${failed ? 'var(--err-line)' : 'var(--blue-soft)'}"><title>${i * 4}–${i * 4 + 3}: ${b}</title></rect>`).join('');
  return `<figure style="margin:0"><svg class="minichart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Histogram of ${esc(label)} scores${failed ? ', not normal' : ''}">${bars}<line x1="2" y1="${H - 14}" x2="${W - 4}" y2="${H - 14}" style="stroke:var(--border-strong)"/><text x="4" y="${H - 2}">0</text><text x="${W - 16}" y="${H - 2}">40</text></svg>
    <figcaption class="xs"><b>${esc(label)}</b> ${failed ? '✕ not normal' : '✓ ok'}</figcaption></figure>`;
}
function boxplot(desc) {
  const W = 520, rowH = 44, H = desc.length * rowH + 26, x = v => 110 + (v / 40) * (W - 130);
  let s = `<svg class="minichart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Box plot of stress scores by teaching method">`;
  desc.forEach((d, i) => {
    const y = 14 + i * rowH;
    s += `<text x="0" y="${y + 18}" style="font-size:12px">${esc(d.group)}</text>
      <line x1="${x(d.min)}" x2="${x(d.max)}" y1="${y + 14}" y2="${y + 14}" style="stroke:var(--text-2)"/>
      <rect x="${x(d.q1)}" y="${y + 2}" width="${x(d.q3) - x(d.q1)}" height="24" rx="3" style="fill:var(--pale);stroke:var(--blue)"/>
      <line x1="${x(d.median)}" x2="${x(d.median)}" y1="${y}" y2="${y + 28}" style="stroke:var(--navy);stroke-width:3"/>
      <text x="${x(d.median) + 4}" y="${y + 40}">median ${r2(d.median)}</text>`;
  });
  [0, 10, 20, 30, 40].forEach(v => s += `<text x="${x(v) - 4}" y="${H - 2}">${v}</text>`);
  return s + '</svg>';
}

    <h4>Variable types</h4><p>${px(`Your outcome (stress score) is a number and your groups (teaching method) are categories.`, `Outcome stress_score declared continuous (0–40, 30+ distinct values); factor method nominal with k = 3 levels.`)}</p>
    <h4>Study design</h4><p>${px('Three separate groups of students, each student in one group.', 'Between-subjects, k = 3 independent groups (declared); rule family R-3G applies.')}</p>
    <h4>Assumptions</h4><ul>${c.checks.map(k => `<li>${term(k.termKey, k.assump)} — ${k.result === 'pass' ? '✓ met' : k.result === 'fail' ? '✕ not met' : '… pending'} <span class="muted">(${k.kind === 'data' ? 'tested on the data' : 'declared study-design assumption'})</span>${S.explain === 'detailed' ? `<br><span class="xs mono">${esc(k.evidence)}</span>` : ''}</li>`).join('')}</ul>
    <h4>When is it used?</h4><p>${ex}</p>

    <h4>Why not the others?</h4><ul>${others.map(o => `<li><b>${esc(o.name)}</b>: ${o.status === 'blocked' ? 'blocked — ' + esc(o.checks.filter(k => k.result === 'fail').map(k => k.assump).join(', ')) + ' not met' : 'also admissible; it tests ' + esc(o.tests)}.</li>`).join('')}</ul>

/* form fields: update state without full re-render (keeps focus while typing) */
function onField(e) {
  const el = e.target;
  if (el.dataset.f && S.declDraft) {
    const d = S.declDraft; const f = el.dataset.f; const v = el.value;
    if (f.includes(':')) { const [kind, col] = f.split(':'); d.vars[col][kind] = v; } else d[f] = v;
    if (d.ai[f]) { d.ai[f] = false; el.classList.remove('ai-field'); if (f === 'design') $$('input[name="design"]').forEach(r => r.closest('.choice').classList.remove('ai-field')); }
    updateDeclFooter(); return;
  }
  if (el.dataset.review) { S.declDraft.reviewed[el.dataset.review] = el.checked; updateDeclFooter(); return; }
  if (el.id === 'ownConfirm') { S.declDraft.ownConfirm = el.checked; updateDeclFooter(); return; }
  if (el.dataset.approve && e.type === 'change') {
    pushUndo('approval'); S.approvals[el.dataset.approve] = el.checked;
    logDecision({ step: 8, category: 'confirmation', text: `${el.checked ? 'Approved' : 'Approval withdrawn'}: ${APPROVAL_LABELS[el.dataset.approve]}.`, reason: el.checked ? 'Reviewed in specification summary' : '' });
    render({ focus: `[data-approve="${el.dataset.approve}"]` }); return;
  }
  if (el.id === 'lockAck' && e.type === 'change') { S.lockAck = el.checked; logDecision({ step: 8, category: 'confirmation', text: el.checked ? 'Acknowledged: record will be locked after running.' : 'Lock acknowledgement withdrawn.' }); render({ focus: '#lockAck' }); return; }
  if (el.name === 'selCand') { S.pendingSel = el.value; return; }
  if (el.id === 'ovJust') { $('#ovCount').textContent = el.value.trim().length; return; }
  if (el.dataset.cmp && e.type === 'change') { S.verifier['cmp' + el.dataset.cmp] = el.value; render({ focus: '#cmp' + el.dataset.cmp }); return; }
  if (el.dataset.audit) { S.auditFilter[el.dataset.audit] = el.value; const pos = el.selectionStart; render({ focus: '#' + el.id }); if (el.dataset.audit === 'q') { const n = $('#auQ'); n.setSelectionRange(pos, pos); } return; }
  const errId = el.id && $('#' + el.id + '-err'); if (errId && el.value.trim().length >= 8) errId.textContent = '';
}

function showTip(el) {

  const r = el.getBoundingClientRect(); const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left)) + 'px';
  tip.style.top = (r.bottom + th + 8 > window.innerHeight ? r.top - th - 6 : r.bottom + 6) + 'px';

/* keyboard: Esc everywhere; shortcuts in expert mode; focus trap in modal/drawers */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#tooltip').style.display === 'block') return hideTip(); if (tourI >= 0) return endTour(); if ($('#modal').classList.contains('show')) return closeModal(); if ($('.drawer.open')) return closeDrawers(); }
  if (e.key === 'Tab') {
    const box = $('#modal').classList.contains('show') ? $('#modalBox') : $('.drawer.open');
    if (box) { const f = $$('button:not([disabled]), input:not([disabled]), select, textarea, a[href], summary, [tabindex="0"]', box).filter(x => x.offsetParent !== null); if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); } }
  }
  if (e.altKey && S.mode === 'expert') {
    const k = e.code;
    if (k === 'KeyN' && S.role === 'researcher') { e.preventDefault(); go(S.view === 'dashboard' ? 1 : Math.min(10, S.view + 1)); }
    else if (k === 'KeyP' && S.role === 'researcher') { e.preventDefault(); go(S.view === 'dashboard' || S.view === 1 ? 'dashboard' : S.view - 1); }
    else if (k === 'KeyD') { e.preventDefault(); S.role = 'researcher'; go('dashboard'); }
    else if (k === 'KeyL') { e.preventDefault(); ACT.toggleLog(); }
    else if (k === 'KeyK') { e.preventDefault(); openDrawer('assistDrawer'); }
    else if (k === 'KeyH') { e.preventDefault(); openDrawer('helpDrawer'); }
  }
});
window.addEventListener('resize', () => { renderShell(); });

/* ---------- boot ---------- */
S.checks = [];
S.logOpen = window.innerWidth > 1180;
render();
/* Offer the getting-started tour once (novice default); never forced */
setTimeout(() => {
  if (S.tourOffered) return; S.tourOffered = true;
  toast('info', 'New to VERA? Take a 1-minute guided tour.', { label: 'Start tour', fn: startTour });
}, 600);

</script>
</body>
</html>
