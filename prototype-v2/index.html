<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERA Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm research tool. Navy header, a 5-step progress rail, one big question per screen, evidence on the side. */
:root{
  --navy:#14254A;
  --blue:#5E8FCB;
  --orange:#E5862A;
  --pale:#EAF1FA;
  --white:#FFFFFF;
  --ink:#18223A;
  --muted:#5A6679;
  --line:#D3DCE9;
  --bg:#F6F8FC;
  --good:#23794A; --good-bg:#E5F3EA;
  --warn:#9A5B0E; --warn-bg:#FCF0DF;
  --bad:#A8332B; --bad-bg:#FBE8E6;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{background:var(--navy);color:var(--white)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em}
.brand small{font-family:var(--body);font-weight:400;font-size:13px;letter-spacing:0;opacity:.75}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:transparent;border:0;color:#C9D6EC;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--white)}
.nav .tag{font-size:11px;background:var(--orange);color:var(--navy);padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:600;vertical-align:1px}
.protobar{background:#FFF6EA;border-bottom:1px solid #F1D9B8;color:#6B4510;font-size:13.5px}
.protobar div{max-width:1100px;margin:0 auto;padding:7px 20px}

main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 22px;padding:0;list-style:none}
.steps li button{width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:56px}
.steps li button:disabled{cursor:default;opacity:.55}
.steps .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--pale);color:var(--navy)}
.steps .l{font-size:13.5px;line-height:1.25;font-weight:500}
.steps li.done .n{background:var(--navy);color:var(--white)}
.steps li.cur button{border-color:var(--orange);box-shadow:0 0 0 2px rgba(229,134,42,.25)}
.steps li.cur .n{background:var(--orange);color:var(--white)}

/* cards & type */
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:26px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
h1.q{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.4vw,38px);line-height:1.15;margin:0 0 8px;color:var(--navy);text-wrap:balance}
h1.q.big{font-size:clamp(30px,4.4vw,48px)}
.lead{color:var(--muted);margin:0 0 22px;max-width:65ch;font-size:17px}
h2{font-family:var(--display);font-size:21px;margin:0 0 10px;color:var(--navy);text-wrap:balance}
h3{font-size:15px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.grid2.even{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--white)}
.panel.soft{background:var(--pale);border-color:#D5E2F3}

/* role chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:2px}
.chip.rule{background:var(--navy);color:var(--white)}
.chip.you{background:var(--orange);color:var(--white)}
.chip.ai{background:var(--white);color:#2F5F99;border:1px dashed var(--blue)}
.chip.sim{background:#EEF0F4;color:#4B5567;border:1px dashed #9AA4B5}

/* buttons */
.btn{border:1px solid var(--navy);background:var(--white);color:var(--navy);border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pale)}
.btn.primary{background:var(--navy);color:var(--white)}
.btn.primary:hover{background:#1F3566}
.btn.accent{background:var(--orange);border-color:var(--orange);color:var(--white)}
.btn.accent:hover{background:#D1741B}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.lg{padding:14px 26px;font-size:17px}
.link{background:none;border:0;color:#2F5F99;text-decoration:underline;cursor:pointer;padding:0;font-weight:500}
.footer-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted)}

/* forms */
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 5px}
.in{width:100%;border:1px solid #BFCBDD;border-radius:9px;padding:9px 11px;background:var(--white)}
textarea.in{min-height:70px;resize:vertical}
.in.drafted{background:#F4F8FE;border-style:dashed;border-color:var(--blue)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fieldtag{font-size:11.5px;font-weight:600;margin-left:6px}
.fieldtag.ai{color:#2F5F99}
.fieldtag.you{color:var(--orange)}
.seg{display:inline-flex;background:var(--pale);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--navy)}
.seg button[aria-pressed="true"]{background:var(--white);box-shadow:0 1px 3px rgba(20,37,74,.18)}

/* dropzone */
.drop{border:2px dashed #AFC2DD;border-radius:12px;padding:22px;text-align:center;background:#FBFCFE}
.drop.over{border-color:var(--orange);background:#FFF8F0}
.drop input{display:none}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid #E7ECF3;white-space:nowrap}
th{background:#F2F5FA;font-weight:600;font-size:13px;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13.5px}
tr:last-child td{border-bottom:0}
td.miss{background:var(--warn-bg);color:var(--warn);font-weight:600;font-family:var(--body)}

/* findings */
.find{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.find li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#F7F9FC;border:1px solid #E6ECF4}
.ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--white);margin-top:1px}
.ic.ok{background:var(--good)} .ic.warn{background:var(--orange)} .ic.bad{background:var(--bad)} .ic.info{background:var(--blue)}

/* choice cards */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{border:2px solid var(--line);background:var(--white);border-radius:14px;padding:18px 18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.choice:hover{border-color:var(--blue)}
.choice[aria-pressed="true"]{border-color:var(--orange);background:#FFF8F0}
.choice b{font-size:18px;color:var(--navy)}
.choice span{font-size:14px;color:var(--muted)}

/* status */
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.block{background:var(--bad-bg);color:var(--bad)}
.pill.ask{background:var(--warn-bg);color:var(--warn)}
.pill.neutral{background:#EEF1F6;color:var(--muted)}
.callout{border-radius:12px;padding:14px 16px;border-left:5px solid}
.callout.ok{background:var(--good-bg);border-color:var(--good)}
.callout.bad{background:var(--bad-bg);border-color:var(--bad)}
.callout.ask{background:var(--warn-bg);border-color:var(--orange)}
.callout.info{background:var(--pale);border-color:var(--blue)}

.decision{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--white)}
.decision.blocked{border-color:#E7B5B0}
.decision.eligible{border-color:#B6DCC4}
.checks{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14.5px}
.rid{font-family:var(--mono);font-size:12px;color:var(--muted);background:#F1F4F9;padding:1px 6px;border-radius:4px;margin-right:6px}
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--white)}
.mrow.sel{border-color:var(--orange);box-shadow:0 0 0 2px rgba(229,134,42,.2)}
details summary{cursor:pointer;color:#2F5F99;font-weight:500;font-size:14px}

/* summary grid */
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sumgrid .panel h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--white);cursor:pointer}
.radio:has(input:checked){border-color:var(--orange);background:#FFF8F0}
.radio input{margin-top:4px;accent-color:var(--orange)}
.gate{font-family:var(--mono);font-size:13px;font-weight:500}

/* results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--white)}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--display);font-weight:600;font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.headline{font-family:var(--display);font-size:clamp(26px,3.6vw,40px);color:var(--navy);margin:0 0 4px;line-height:1.15;font-weight:600;text-wrap:balance}
pre.json{background:#0F1B36;color:#DCE6F7;padding:14px;border-radius:10px;font-size:12.5px;max-height:320px;overflow:auto;font-family:var(--mono)}
.verdict{display:flex;gap:14px;align-items:center;border-radius:14px;padding:16px 18px}
.verdict.ok{background:var(--good-bg);border:1px solid #B6DCC4}
.verdict.bad{background:var(--bad-bg);border:1px solid #E7B5B0}
.verdict .big{font-family:var(--display);font-size:24px;font-weight:600}
.filebox{border:1px solid var(--line);border-radius:12px;padding:14px;background:#FBFCFE;display:flex;flex-direction:column;gap:8px}
.filebox input[type=file]{font-size:14px}
.ok-t{color:var(--good);font-weight:600} .bad-t{color:var(--bad);font-weight:600}
svg text{font-family:var(--body)}

/* sensitivity */
.synbanner{display:flex;gap:12px;align-items:center;background:var(--navy);color:var(--white);border-radius:12px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap}
.synbanner b{background:var(--orange);color:var(--navy);padding:2px 8px;border-radius:6px;font-size:13px;letter-spacing:.05em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.tile{border:1px solid var(--line);border-radius:12px;background:var(--white);padding:14px}
.tile .v{font-family:var(--display);font-size:28px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
.tile .k{font-size:13.5px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--orange);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sensout{border-radius:14px;padding:18px;border:2px solid}
.sensout.stable{border-color:var(--good);background:var(--good-bg)}
.sensout.uncertain{border-color:var(--orange);background:var(--warn-bg)}
.sensout.reverses{border-color:var(--bad);background:var(--bad-bg)}
.sensout .est{font-family:var(--display);font-size:clamp(28px,3.6vw,40px);font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.legend3{display:flex;gap:8px;flex-wrap:wrap}
.roles3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.roles3 .panel{font-size:14px}

.running{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--pale)}
.spin{width:20px;height:20px;border:3px solid #BFD0EA;border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--white);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.2)}

@media (max-width:820px){
  .grid2,.grid2.even,.choices,.sumgrid,.roles3,.tiles{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(5,minmax(0,1fr))}
  .steps .l{display:none}
  .steps li button{justify-content:center;padding:8px}
  .roles{grid-template-columns:1fr}
  .card{padding:18px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#0D1A38"/><path d="M8 9 L16 26 L24 9" fill="none" stroke="#F4EBD9" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26.5" cy="24.5" r="3" fill="#E5862A"/></svg>
      VERA <small>Verifiable research analysis</small>
    </div>
    <nav class="nav" aria-label="Main">
      <button data-act="view" data-v="flow" id="nav-flow">Analysis workflow</button>
      <button data-act="view" data-v="sens" id="nav-sens">Missing-exam demo<span class="tag">SYNTHETIC</span></button>
    </nav>
  </div>
</header>
<div class="protobar"><div><b>Prototype.</b> Everything runs in your browser. Parts marked <span class="chip ai">AI-assisted · simulated</span> or <span class="chip sim">Simulated backend</span> are stand-ins. The <span class="chip rule">Rule engine</span> checks methods; <span class="chip you">You decide</span> marks choices only the researcher makes.</div></div>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
// ==ENGINE==
/* ---------- numerics ---------- */
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<6;j++)ser+=c[j]/++y;return -tmp+Math.log(2.5066282746310005*ser/x);}
function betacf(a,b,x){const MAXIT=200,EPS=3e-14,FPMIN=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;}
function betai(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function tCDF(t,df){const x=df/(df+t*t);const p=0.5*betai(df/2,0.5,x);return t>0?1-p:p;}
function tInv(p,df){let lo=-200,hi=200;for(let i=0;i<120;i++){const m=(lo+hi)/2;if(tCDF(m,df)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
function normCDF(z){return 0.5*(1+erf(z/Math.SQRT2));}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
function sd(a){const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1));}
function skew(a){const m=mean(a),n=a.length,s=Math.sqrt(a.reduce((t,v)=>t+(v-m)**2,0)/n);if(s===0)return 0;return a.reduce((t,v)=>t+((v-m)/s)**3,0)/n;}

/* ---------- paired tests ---------- */
function pairedT(pairs){
  const n=pairs.length,d=pairs.map(p=>p.a-p.b),md=mean(d),s=sd(d),se=s/Math.sqrt(n),df=n-1,t=md/se;
  const p=2*(1-tCDF(Math.abs(t),df)),tc=tInv(0.975,df);
  return {method:'paired_t',n_pairs:n,mean_before:mean(pairs.map(p=>p.b)),mean_after:mean(pairs.map(p=>p.a)),mean_diff:md,sd_diff:s,ci_low:md-tc*se,ci_high:md+tc*se,t:t,df:df,p:p,dz:md/s};
}

/* ---------- missing-exam scenario values (synthetic; from Mahdi's sensitivity lab) ---------- */
const SENS_VALUES=[[3.41,0.94,5.88],[3.02,0.55,5.49],[2.63,0.14,5.11],[2.24,-0.26,4.73],[1.84,-0.68,4.37],[1.45,-1.10,4.01],[1.06,-1.53,3.65],[0.67,-1.96,3.30],[0.28,-2.40,2.96],[-0.11,-2.84,2.62],[-0.50,-3.29,2.29],[-0.89,-3.75,1.96],[-1.28,-4.20,1.64],[-1.67,-4.67,1.32],[-2.07,-5.13,1.00],[-2.46,-5.60,0.69],[-2.85,-6.08,0.38],[-3.24,-6.55,0.08],[-3.63,-7.03,-0.23],[-4.02,-7.51,-0.53],[-4.41,-8.00,-0.82],[-4.80,-8.49,-1.12],[-5.19,-8.97,-1.41],[-5.58,-9.46,-1.70],[-5.98,-9.96,-1.99]];
const SENS_OBS={est:3.44,lo:0.90,hi:5.99,n:90};
function sensStatus(o){return o.lo>0?'stable':o.hi<0?'reverses':'uncertain';}
// ==END ENGINE==

/* ---------- sample data ---------- */
const SAMPLE_NAME='training_scores.csv';
const SAMPLE_CSV=`participant_id,score_before,score_after
P01,62,70
P02,55,61
P03,71,69
P04,48,57
P05,66,69
P06,59,68
P07,74,78
P08,52,62
P09,63,67
P10,58,63
P11,69,79
P12,45,54
P13,61,66
P14,57,
P15,70,77
P16,53,60
P17,64,66
P18,50,58
P19,67,73
P20,60,64
`;
const RULESET='VERA sample policy, rules R01\u2013R08';
const METHODS={
  paired_t:{name:'Paired t-test',design:'paired',short:'Compares each person\u2019s after score with their own before score.'},
  welch:{name:'Welch\u2019s t-test',design:'independent',short:'Compares the averages of two separate groups of people.'},
  ols:{name:'Linear regression',design:'predictor',short:'Models a score from one or more numeric predictors, with one independent observation per person.'}
};
const ELIGIBLE={paired:'paired_t',independent:'welch',predictor:'ols'};

function parseCSV(text){
  const rows=[];let cur=[''],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur[cur.length-1]+='"';i++;}else q=false;}else cur[cur.length-1]+=c;}
    else if(c==='"')q=true;else if(c===',')cur.push('');else if(c==='\n'){rows.push(cur);cur=[''];}else if(c!=='\r')cur[cur.length-1]+=c;}
  if(cur.length>1||cur[0]!=='')rows.push(cur);
  const clean=rows.filter(r=>r.some(c=>c.trim()!==''));
  if(clean.length<2)throw new Error('The file needs a header row and at least one data row.');
  const headers=clean[0].map(h=>h.trim());
  return {headers,rows:clean.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??'').trim()])))};
}
function guessRoles(h){
  const f=re=>h.find(x=>re.test(x))||'';
  let id=f(/(^id$|_id$|participant|student|subject|^id)/i),b=f(/(before|pre|baseline|t1)/i),a=f(/(after|post|t2)/i);
  const rest=h.filter(x=>x!==id&&x!==b&&x!==a);
  if(!id)id=rest.shift()||'';if(!b)b=rest.shift()||'';if(!a)a=rest.shift()||'';return {id,before:b,after:a};
}
async function fingerprint(text){
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return 'sha256:'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=0x811c9dc5;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return 'fnv32:'+h.toString(16);}
}

/* ---------- profile & rule engine ---------- */
function profileOf(data,roles){
  const ids=[],seen=new Set(),dups=new Set(),missB=[],missA=[],bad=[],pairs=[];let mn=Infinity,mx=-Infinity;
  data.rows.forEach((r,i)=>{const id=r[roles.id]||('row '+(i+1));ids.push(id);if(seen.has(id))dups.add(id);seen.add(id);
    const b=num(r[roles.before]),a=num(r[roles.after]);
    if(Number.isNaN(b)||Number.isNaN(a))bad.push(id);
    if(b===null)missB.push(id);if(a===null)missA.push(id);
    [b,a].forEach(v=>{if(v!==null&&!Number.isNaN(v)){mn=Math.min(mn,v);mx=Math.max(mx,v);}});
    if(b!==null&&a!==null&&!Number.isNaN(b)&&!Number.isNaN(a))pairs.push({id,b,a});});
  const incomplete=data.rows.map((r,i)=>ids[i]).filter(id=>!pairs.find(p=>p.id===id));
  return {n:data.rows.length,unique:seen.size,dups:[...dups],missB,missA,bad,pairs,incomplete,min:mn,max:mx,
    groupCol:data.headers.find(h=>/^(group|condition|arm|cohort)$/i.test(h))||null};
}
function profile(){return profileOf(S.data,S.roles);}

function evaluate(mid){
  const P=profile(),m=METHODS[mid],checks=[],np=P.pairs.length,elig=ELIGIBLE[S.design]||'paired_t';
  checks.push({rule:'R01',label:'Observation structure confirmed',outcome:'pass',detail:'Study declaration: the same people were measured twice (confirmed by you).'});
  if(P.incomplete.length||P.bad.length){
    const done=S.missing==='exclude',ids=P.incomplete.join(', ');
    checks.push({rule:'R04',label:'Missing or invalid numbers',outcome:done?'pass':'ask',
      detail:done?'Resolved by you: '+ids+' left out, so '+np+' complete pairs remain.':ids+' '+(P.incomplete.length>1?'have':'has')+' a missing score. You\u2019ll decide how to handle '+(P.incomplete.length>1?'them':'it')+' in Step 4.'});
  }else checks.push({rule:'R04',label:'Missing or invalid numbers',outcome:'pass',detail:'All required numeric values are present.'});
  checks.push({rule:'R02',label:'Matched pairs',outcome:(P.dups.length||np<2)?'fail':'pass',
    detail:P.dups.length?'Some IDs appear more than once ('+P.dups.join(', ')+'). A paired comparison needs one before and one after score per person.':np+' participants have one score before and one after training.'});
  let alt=null;
  if(m.design===S.design){
    checks.push({rule:'R05',label:'Method is eligible for the confirmed design',outcome:'pass',detail:'Candidate method: '+m.name+'.'});
    checks.push({rule:'R07',label:'You reviewed the method requirements',outcome:S.reviewed?'pass':'ask',
      detail:S.reviewed?'You confirmed the requirements a CSV cannot show: participants did not affect each other\u2019s scores, and the score changes have no extreme outliers.':'A CSV cannot show whether participants affected each other\u2019s scores, or whether the changes contain extreme outliers. Review and confirm below.'});
    const d=P.pairs.map(p=>p.a-p.b),ok=np>=2&&sd(d)>0;
    checks.push({rule:'R08',label:'The calculation is defined',outcome:ok?'pass':'fail',detail:ok?'With '+np+' pairs and varied score changes, the paired t statistic can be computed.':'The score changes do not vary, so the t statistic cannot be computed.'});
  }else{
    const why=mid==='welch'
      ?'Welch\u2019s t-test compares two separate groups of people. You confirmed the same people were measured twice, so it would treat each person\u2019s two scores as unrelated and ignore the pairing.'
      :'Linear regression here would treat all '+(np*2)+' scores as independent observations. You confirmed each person was measured twice, so their two scores are linked, and your question is about each person\u2019s change.';
    checks.push({rule:'R05',label:'Method is eligible for the confirmed design',outcome:'fail',detail:why+' The eligible candidate is '+METHODS[elig].name+'.'});
    alt=elig;
  }
  const status=checks.some(c=>c.outcome==='fail')?'blocked':'eligible';
  const asks=checks.filter(c=>c.outcome==='ask').length;
  let explain;
  if(status==='blocked'&&alt)explain=m.name+' conflicts with the confirmed setup: your study measured the same people twice. The eligible candidate is '+METHODS[alt].name+'.';
  else if(status==='blocked')explain=m.name+' is blocked because one of its requirements is not met by your data.';
  else explain='The confirmed setup allows '+m.name+'. It compares each participant with themselves'+(asks?'. '+asks+' open question'+(asks>1?'s':'')+' remain'+(asks>1?'':'s')+'.':'.');
  return {mid,status,checks,alt,asks,explain};
}

function runAnalysis(){return pairedT(profile().pairs);}
const RESULT_KEYS={paired_t:[['n_pairs','Complete pairs',0],['mean_before','Mean before',3],['mean_after','Mean after',3],['mean_diff','Mean change',3],['ci_low','95% CI lower',3],['ci_high','95% CI upper',3],['t','t statistic',3],['df','Degrees of freedom',0],['p','p-value',4],['dz','Effect size dz',3]]};
const r6=v=>Math.round(v*1e6)/1e6;

async function buildRecord(res){
  const P=profile(),ev=evaluate(S.method);
  return {
    vera_record:'0.1-prototype',
    created_at:new Date().toISOString(),
    dataset:{file_name:S.data.name,fingerprint:S.hash,rows:P.n,columns:S.data.headers,original_preserved:true},
    study_declaration:{question:S.details.question,population:S.details.population,column_roles:{...S.roles},
      design:'paired',design_question:'Were the same participants measured before and after training?',design_answer:'Yes',decided_by:'researcher',
      draft_source:Object.keys(S.ai).length?'AI draft (simulated), checked and confirmed by researcher':'entered by researcher'},
    method_requirements_reviewed:{by:'researcher',rule:'R07'},
    data_findings:{unique_ids:P.unique,duplicate_ids:P.dups,missing_before:P.missB,missing_after:P.missA,score_range:[P.min,P.max]},
    preparation:P.incomplete.length?[{step:'exclude_incomplete_pairs',ids:P.incomplete,decided_by:'researcher',reason:'Paired methods need both scores'}]:[],
    method:{id:S.method,name:METHODS[S.method].name,alpha:0.05,alternative:'two-sided',chosen_by:'researcher',route:S.m3==='check'?'checked a method I want to use':'chose from eligible methods'},
    rule_checks:ev.checks.map(c=>({rule:c.rule,check:c.label,outcome:c.outcome,detail:c.detail})),
    gate:'authorize',approved_by:'researcher',approved_at:new Date().toISOString(),
    policy_version:RULESET,software:'vera-prototype-web 0.1 (browser)',
    results:Object.fromEntries(RESULT_KEYS[S.method].map(([k])=>[k,r6(res[k])]))
  };
}

/* ---------- replay ---------- */
async function replay(csvText,recText){
  let rec,data;
  try{rec=JSON.parse(recText);}catch(e){return {error:'The decision record is not valid JSON. Load the .json file VERA produced.'};}
  try{data=parseCSV(csvText);}catch(e){return {error:'The data file could not be read: '+e.message};}
  if(!rec.study_declaration||!rec.method||!rec.results)return {error:'This JSON file is not a VERA decision record.'};
  const fpNow=await fingerprint(csvText),hashMatch=fpNow===rec.dataset.fingerprint;
  const roles=rec.study_declaration.column_roles;
  if(!data.headers.includes(roles.before)||!data.headers.includes(roles.after))return {error:'The data file does not have the columns named in the record ('+roles.before+', '+roles.after+').'};
  const P=profileOf(data,roles),recEx=(rec.preparation[0]||{}).ids||[];
  const prepMatch=JSON.stringify(P.incomplete)===JSON.stringify(recEx);
  if(!RESULT_KEYS[rec.method.id])return {error:'This prototype can only replay the paired t-test.'};
  const res=pairedT(P.pairs);
  const rows=RESULT_KEYS[rec.method.id].map(([k,label,d])=>{const a=rec.results[k],b=r6(res[k]);return {label,rec:a,rep:b,d,match:Math.abs(a-b)<1e-6};});
  return {hashMatch,fpNow,fpRec:rec.dataset.fingerprint,prepMatch,recEx,nowEx:P.incomplete,rows,all:rows.every(r=>r.match),method:rec.method.name,rule:rec.policy_version};
}

/* ---------- step 5 ---------- */
function explainText(r){
  if(r.method==='paired_t'){
    const size=Math.abs(r.dz)<0.2?'negligible':Math.abs(r.dz)<0.5?'small':Math.abs(r.dz)<0.8?'medium':'large';
    const sig=r.p<0.05;
    return `On average, the ${r.n_pairs} participants scored ${fx(Math.abs(r.mean_diff))} points ${r.mean_diff>=0?'higher':'lower'} after training than before (95% CI ${fx(r.ci_low)} to ${fx(r.ci_high)}). ${sig?'A change this large would be unlikely if scores had not really changed':'This change could plausibly be due to chance'} (${fp(r.p)}). The effect size is ${size} (d<sub>z</sub> = ${fx(r.dz,2)}). There was no comparison group, so this shows that scores ${r.mean_diff>=0?'rose':'fell'} in this group. It does not prove the training caused the change.`;
  }
  return `The median change across ${r.n_pairs} participants was ${sg(r.median_diff)} points. ${r.p<0.05?'Scores were reliably different after training':'The data do not show a reliable change'} (Wilcoxon signed-rank, z = ${fx(r.z,2)}, ${fp(r.p)}). There was no comparison group, so this does not prove the training caused the change.`;
}
function step5(){

    <p class="lead">A verifier loads the original data and the decision record. VERA replays the approved plan and compares every value.</p>${tabs}${verifyView()}</section>`;
  const head=r.method==='paired_t'?`Scores were ${fx(Math.abs(r.mean_diff))} points ${r.mean_diff>=0?'higher':'lower'} after training`:`Median change of ${sg(r.median_diff)} points after training`;
  const stats=r.method==='paired_t'?[
    ['Mean before',fx(r.mean_before),'out of 100'],['Mean after',fx(r.mean_after),'out of 100'],['Mean change',sg(r.mean_diff),'95% CI '+fx(r.ci_low)+' to '+fx(r.ci_high)],
    ['p-value',r.p<0.001?'< .001':r.p.toFixed(3).replace(/^0/,''),'t('+r.df+') = '+fx(r.t,2)],['Effect size',fx(r.dz,2),'Cohen’s dₓ'.replace('ₓ','z')],['Pairs analysed',r.n_pairs,profile().incomplete.length?profile().incomplete.join(', ')+' left out':'all participants']]
    :[['Median change',sg(r.median_diff),'points'],['p-value',r.p<0.001?'< .001':r.p.toFixed(3).replace(/^0/,''),'z = '+fx(r.z,2)],['Effect size r',fx(r.r,2),''],['Pairs analysed',r.n_pairs,'']];
  return `<section class="card"><p class="eyebrow">Step 5 of 5 · Results</p>${tabs}

    <div class="stats">${stats.map(([k,v,s])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('')}</div>
    <div class="grid2 even">
      <div class="panel"><h3 style="margin-bottom:8px">Each participant, before and after</h3><div id="slope"></div></div>
      <div class="stack">
        <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">What this means</h3><span class="chip ai">AI-assisted · simulated</span></div>
          <p style="margin:0">${explainText(r)}</p><p class="small muted" style="margin:8px 0 0">The wording is drafted from the computed numbers above. The numbers come from the rule-checked analysis.</p></div>

const vf=(r,v)=>r.label==='p-value'&&v<0.0001?'< .0001':fx(v,r.d);
function verifyView(){

    <div class="filebox"><b>2. Decision record</b><input type="file" id="vrec" accept=".json,application/json"><span class="small muted">${v.recName?'Loaded: '+esc(v.recName):'No file loaded'}</span></div>

}
function drawSlope(){
  const el=$('#slope');if(!el)return;const P=profile(),W=420,H=280,top=20,bot=34,lx=110,rx=310;
  const vals=P.pairs.flatMap(p=>[p.b,p.a]);const lo=Math.floor((Math.min(...vals)-3)/5)*5,hi=Math.ceil((Math.max(...vals)+3)/5)*5;
  const y=v=>top+(hi-v)/(hi-lo)*(H-top-bot);let g='';
  for(let v=lo;v<=hi;v+=10)g+=`<line x1="60" x2="${W-50}" y1="${y(v)}" y2="${y(v)}" stroke="#E6ECF4"/><text x="52" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5A6679">${v}</text>`;
  const lines=P.pairs.map(p=>`<line x1="${lx}" y1="${y(p.b)}" x2="${rx}" y2="${y(p.a)}" stroke="${p.a>=p.b?'#9DB8DE':'#E3A49E'}" stroke-width="1.5"/><circle cx="${lx}" cy="${y(p.b)}" r="3" fill="#5E8FCB"/><circle cx="${rx}" cy="${y(p.a)}" r="3" fill="#5E8FCB"><title>${p.id}: ${p.b} → ${p.a}</title></circle>`).join('');
  const mb=mean(P.pairs.map(p=>p.b)),ma=mean(P.pairs.map(p=>p.a));
  const m=`<line x1="${lx}" y1="${y(mb)}" x2="${rx}" y2="${y(ma)}" stroke="#E5862A" stroke-width="4" stroke-linecap="round"/><circle cx="${lx}" cy="${y(mb)}" r="6" fill="#E5862A"/><circle cx="${rx}" cy="${y(ma)}" r="6" fill="#E5862A"/>
    <text x="${lx-12}" y="${y(mb)+4}" font-size="12" font-weight="600" text-anchor="end" fill="#14254A">${fx(mb)}</text><text x="${rx+12}" y="${y(ma)+4}" font-size="12" font-weight="600" fill="#14254A">${fx(ma)}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Before and after scores for each participant, with the average in orange">${g}${lines}${m}
    <text x="${lx}" y="${H-10}" font-size="13" font-weight="600" text-anchor="middle" fill="#14254A">Before</text><text x="${rx}" y="${H-10}" font-size="13" font-weight="600" text-anchor="middle" fill="#14254A">After</text></svg>
    <p class="small muted" style="margin:4px 0 0">Blue lines: one participant each. Orange: the average. ${P.incomplete.length?esc(P.incomplete.join(', '))+' not shown (missing score).':''}</p>`;
}

/* ---------- sensitivity view ---------- */
function ensureSens(){if(CURVE)return;CURVE=SENS_VALUES.map((v,s)=>({s,est:v[0],lo:v[1],hi:v[2]}));OBS=SENS_OBS;}
const SLAB={stable:['STABLE','ok'],uncertain:['UNCERTAIN','ask'],reverses:['REVERSES','block']};
function renderSens(){
  ensureSens();const sv=S.sens,all=sv.pop==='all',o=all?CURVE[sv.shift]:OBS,st=sensStatus(o);
  const firstUnc=CURVE.find(c=>sensStatus(c)!=='stable'),firstNeg=CURVE.find(c=>c.est<0),firstRev=CURVE.find(c=>sensStatus(c)==='reverses');
  const msg={stable:'Training participants still score higher. The conclusion holds under this assumption.',
    uncertain:'The interval now includes zero. Under this assumption the data cannot tell whether training participants scored higher.',
    reverses:'Training participants now score lower. The conclusion reverses under this assumption.'}[st];
  const shiftLabel=sv.shift===0?'As predicted from their prior grades (baseline)':sv.shift+' points lower than predicted';
  return `<div class="synbanner"><b>SYNTHETIC EXAMPLE</b><span>Made-up data for 120 students, from Mahdi’s missing-exam case. Not real study results.</span></div>
  <section class="card">
    <p class="eyebrow">Sensitivity analysis</p>
    <h1 class="q big">When does the conclusion change?</h1>
    <p class="lead">A university offers optional training. Did participants score higher on the final exam, after accounting for prior grades? More training students missed the exam, and nobody knows what they would have scored.</p>
    <div class="tiles">
      <div class="tile"><div class="v">120</div><div class="k">students in the synthetic dataset</div></div>
      <div class="tile"><div class="v" style="color:var(--orange)">24 of 60</div><div class="k">training students missed the exam</div></div>
      <div class="tile"><div class="v">6 of 60</div><div class="k">comparison students missed the exam</div></div>
    </div>
    <div class="grid2">
      <div class="stack">
        <div><div class="row" style="justify-content:space-between;margin-bottom:6px"><label class="f" style="margin:0">Who should the conclusion cover?</label><span class="chip you">You decide</span></div>
          <div class="seg" role="group"><button data-act="pop" data-p="all" aria-pressed="${all}">All enrolled students</button><button data-act="pop" data-p="obs" aria-pressed="${!all}">Students who took the exam</button></div></div>
        <div ${all?'':'style="opacity:.45"'}><div class="row" style="justify-content:space-between;margin-bottom:4px"><label class="f" for="shift" style="margin:0">If the 24 absent training students had sat the exam, how would they have scored?</label><span class="chip you">You decide</span></div>
          <input type="range" id="shift" min="0" max="24" step="1" value="${sv.shift}" ${all?'':'disabled'} aria-describedby="shiftv">
          <div class="ticks"><span>Baseline</span><span>${MINUS}6</span><span>${MINUS}12</span><span>${MINUS}18</span><span>${MINUS}24 pts</span></div>
          <p style="margin:8px 0 0;font-weight:600" id="shiftv">${all?shiftLabel:'Not used for this population'}</p></div>
        <div class="sensout ${st}" id="sensout">
          <div class="row" style="justify-content:space-between"><span class="small" style="font-weight:600">Adjusted score difference (training ${MINUS} comparison)</span><span class="pill ${SLAB[st][1]}">${SLAB[st][0]}</span></div>
          <div class="est">${sg(o.est,2)} points</div><div class="small" style="font-variant-numeric:tabular-nums">95% interval ${sg(o.lo,2)} to ${sg(o.hi,2)}</div>
          <p style="margin:10px 0 0">${all?msg:'This is a separate question about the '+OBS.n+' students with observed scores, so there are no missing scores to vary. Changing who the conclusion covers changes the research target, so VERA treats it as a separate analysis (S01).'}</p>
        </div>
      </div>
      <div class="panel"><h3 style="margin-bottom:6px">How the estimate moves with the assumption</h3><div id="senschart"></div>
        ${all?`<p class="small" style="margin:6px 0 0"><span class="rid">S03</span>Across the tested shifts, the interval first includes zero at <b>${firstUnc.s} points lower</b>. The estimate first turns negative at <b>${firstNeg.s} points lower</b>. The whole interval is below zero from <b>${firstRev.s} points lower</b>.</p>`:''}
        <div class="legend3" style="margin-top:10px"><span class="pill ok">STABLE</span><span class="pill ask">UNCERTAIN</span><span class="pill block">REVERSES</span></div></div>
    </div>
    <div class="roles3" style="margin-top:18px">
      <div class="panel"><h3>Data shows <span class="chip rule">Checked</span></h3>Training participation, prior grades, observed scores, and which scores are missing.</div>
      <div class="panel"><h3>Researcher confirms <span class="chip you">You decide</span></h3>Who the conclusion covers, and the range of score shifts worth exploring. The 0–24 range here is illustrative; a real study must justify its range.</div>
      <div class="panel"><h3>Engine computes <span class="chip sim">Simulated backend</span></h3>Draws 80 sets of missing scores from a model fitted to observed scores, shifts the absent training scores, and pools the regression estimates at each shift. Values shown are the synthetic results from Mahdi’s sensitivity lab.</div>
    </div>
    <details style="margin-top:16px"><summary>View scenario values</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th>Absent training students</th><th class="num">Estimate</th><th class="num">95% interval</th><th>Conclusion</th></tr></thead><tbody>
      ${[0,6,12,18,24].map(s=>{const c=CURVE[s],t=sensStatus(c);return `<tr><td>${s===0?'Baseline (as predicted)':s+' points lower'}</td><td class="num">${sg(c.est,2)}</td><td class="num">${sg(c.lo,2)} to ${sg(c.hi,2)}</td><td><span class="pill ${SLAB[t][1]}">${SLAB[t][0]}</span></td></tr>`;}).join('')}
      <tr><td>Students who took the exam only</td><td class="num">${sg(OBS.est,2)}</td><td class="num">${sg(OBS.lo,2)} to ${sg(OBS.hi,2)}</td><td><span class="pill ${SLAB[sensStatus(OBS)][1]}">${SLAB[sensStatus(OBS)][0]}</span></td></tr></tbody></table></div></details>
    <div class="row" style="margin-top:14px;justify-content:space-between"><p class="small muted" style="margin:0;max-width:70ch">This measures an adjusted association, not proof that training caused higher scores. Methods: controlled multiple imputation (doi:10.1002/sim.8569) and multiverse analysis (doi:10.1177/1745691616658637).</p>
      </div>
  </section>`;
}
function drawSens(){
  const el=$('#senschart');if(!el)return;const all=S.sens.pop==='all';
  const W=460,H=270,L=48,R=16,T=14,B=40;
  const lo=Math.floor(Math.min(...CURVE.map(c=>c.lo),OBS.lo)-1),hi=Math.ceil(Math.max(...CURVE.map(c=>c.hi),OBS.hi)+1);
  const x=s=>L+s/24*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';for(let v=Math.ceil(lo/2)*2;v<=hi;v+=2)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF2F7"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5A6679">${v>0?'+':v<0?MINUS:''}${Math.abs(v)}</text>`;
  [0,6,12,18,24].forEach(s=>g+=`<text x="${x(s)}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="#5A6679">${s===0?'0':MINUS+s}</text>`);
  const band='M'+CURVE.map(c=>x(c.s)+','+y(c.hi)).join(' L')+' L'+CURVE.slice().reverse().map(c=>x(c.s)+','+y(c.lo)).join(' L')+'Z';
  const line='M'+CURVE.map(c=>x(c.s)+','+y(c.est)).join(' L');
  const fu=CURVE.find(c=>sensStatus(c)!=='stable');
  const cur=CURVE[S.sens.shift];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Estimate and 95% interval as the assumed shift grows">${g}
    <path d="${band}" fill="#5E8FCB" opacity="${all?.22:.1}"/><path d="${line}" fill="none" stroke="#14254A" stroke-width="2.5" opacity="${all?1:.3}"/>
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#A8332B" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${y(0)-6}" font-size="11" text-anchor="end" fill="#A8332B">no difference</text>
    ${fu&&all?`<line x1="${x(fu.s)}" x2="${x(fu.s)}" y1="${T}" y2="${H-B}" stroke="#E5862A" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${x(fu.s)+5}" y="${T+11}" font-size="11" font-weight="600" fill="#9A5B0E">tipping point</text>`:''}
    ${all?`<line x1="${x(cur.s)}" x2="${x(cur.s)}" y1="${y(cur.lo)}" y2="${y(cur.hi)}" stroke="#E5862A" stroke-width="3"/><circle cx="${x(cur.s)}" cy="${y(cur.est)}" r="7" fill="#E5862A" stroke="#fff" stroke-width="2"/>`:''}
    <text x="${(L+W-R)/2}" y="${H-6}" font-size="12" text-anchor="middle" fill="#18223A">Assumed shift for absent training students (points)</text></svg>`;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='view'){S.view=b.dataset.v;render();window.scrollTo({top:0});}
  else if(a==='goto'){const n=+b.dataset.n;if(n<=S.maxStep){S.step=n;render();window.scrollTo({top:0,behavior:'smooth'});}}
  else if(a==='sample')loadData(SAMPLE_NAME,SAMPLE_CSV);
  else if(a==='clear'){S.data=null;S.ai={};S.mode='manual';S.maxStep=1;render();}
  else if(a==='mode'){if(b.dataset.m==='ai')aiDraft();else{S.mode='manual';Object.keys(S.ai).forEach(k=>{if(S.ai[k]==='ai')S.ai[k]='you';});render();}}
  else if(a==='next1')go(2);
  else if(a==='design'){S.design=b.dataset.d;S.checked=null;S.method=null;S.missing=null;S.tick=false;S.reviewed=false;S.result=null;S.maxStep=2;render();}
  else if(a==='next2')go(3);
  else if(a==='m3'){S.m3=b.dataset.m;render();}
  else if(a==='check'){S.pick=$('#pick').value;S.checked=S.pick==='eligible'?(ELIGIBLE[S.design]||'paired_t'):S.pick;render();}
  else if(a==='use'){S.method=b.dataset.m;if(S.m3==='check'){S.checked=b.dataset.m;if(S.pick!=='eligible')S.pick=b.dataset.m;}S.tick=false;S.maxStep=3;render();}
  else if(a==='okdraft'){S.draftOk=true;render();}
  else if(a==='undraft'){S.draftOk=false;render();}
  else if(a==='next3')go(4);
  else if(a==='run'){S.running=true;render();
    S.hash=await fingerprint(S.data.text);
    setTimeout(async()=>{S.result=runAnalysis();S.record=await buildRecord(S.result);S.recordText=JSON.stringify(S.record,null,2);S.running=false;S.tab5='result';S.ver={csv:null,csvName:'',rec:null,recName:'',out:null};go(5);},900);}
  else if(a==='tab5'){S.tab5=b.dataset.t;render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(a==='dlrec')save('vera_decision_record.json',S.recordText);
  else if(a==='dlcsv')save(S.data.name.replace(/\.csv$/i,'')+'.csv',S.data.text);
  else if(a==='restart'){Object.assign(S,{step:1,maxStep:1,data:null,roles:{id:'',before:'',after:''},details:{question:'',population:''},mode:'manual',ai:{},design:null,checked:null,method:null,missing:null,tick:false,reviewed:false,draftOk:false,result:null,record:null});render();}
  else if(a==='vsession'){S.ver={csv:S.data.text,csvName:S.data.name+' (from this session)',rec:S.recordText,recName:'vera_decision_record.json (from this session)',out:null};render();}
  else if(a==='vtamper'){const t=S.data.text.replace(/\nP03,71,69/,'\nP03,71,85');S.ver={csv:t===S.data.text?S.data.text+' ':t,csvName:'edited copy (one after score changed)',rec:S.recordText,recName:'vera_decision_record.json (from this session)',out:null};S.ver.out=await replay(S.ver.csv,S.ver.rec);render();}
  else if(a==='vrun'){S.ver.out=await replay(S.ver.csv,S.ver.rec);render();}
  else if(a==='pop'){S.sens.pop=b.dataset.p;render();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.field){S.details[t.dataset.field]=t.value;if(S.ai[t.dataset.field]==='ai'){S.ai[t.dataset.field]='you';t.classList.remove('drafted');const tg=t.parentElement.querySelector('.fieldtag');if(tg){tg.className='fieldtag you';tg.textContent='Corrected by you';}}refresh1();}
  if(t.id==='shift'){S.sens.shift=+t.value;const keep=document.activeElement===t;render();if(keep){const s=$('#shift');s&&s.focus();}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.role){S.roles[t.dataset.role]=t.value;if(S.ai.roles==='ai')S.ai.roles='you';render();}
  else if(t.id==='file1'&&t.files[0]){const f=t.files[0];loadData(f.name,await f.text());}
  else if(t.name==='miss'){S.missing=t.value;S.tick=false;render();}
  else if(t.id==='tick'){S.tick=t.checked;render();}
  else if(t.id==='reviewed'){S.reviewed=t.checked;render();}
  else if(t.id==='vcsv'&&t.files[0]){S.ver.csv=await t.files[0].text();S.ver.csvName=t.files[0].name;S.ver.out=null;render();}
  else if(t.id==='vrec'&&t.files[0]){S.ver.rec=await t.files[0].text();S.ver.recName=t.files[0].name;S.ver.out=null;render();}
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,async e=>{
  const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();
  if(ev==='dragover')d.classList.add('over');else d.classList.remove('over');
  if(ev==='drop'&&e.dataTransfer.files[0]){const f=e.dataTransfer.files[0];loadData(f.name,await f.text());}
}));
render();
</script>
